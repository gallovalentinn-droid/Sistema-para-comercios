      $('#facFoto',ov).onchange=e=>{ if(e.target.files[0]) leerFacturaFoto(e.target.files[0],ov); };
      $('#facProv',ov).onchange=e=>remitoHeader.proveedor=e.target.value;
      $('#facNro',ov).onchange=e=>remitoHeader.nroComprobante=e.target.value;
      $('#facTotal',ov).oninput=()=>{ remitoHeader.total=$('#facTotal',ov).value; pintarRemito(); };
      pintarRemito();
      $('#okIng',ov).onclick=()=>{
        if(!remito.length){aviso('No cargaste ningún producto','bad');return;}
        const proveedorFac=$('#facProv',ov).value.trim();
        const nroFac=$('#facNro',ov).value.trim();
        const cambios=[];
        remito.forEach(l=>{
          const p=prod(l.prodId); if(!p) return;
          const unidades=unidadesLinea(l);
          p.stock=Number(p.stock)+unidades;
          const cu=costoLinea(l,p);
          let extra;
          if(cu!==null&&cu>0&&Math.abs(cu-Number(p.costo))>0.005){
            extra={costoAnterior:Number(p.costo),costoNuevo:cu};
            cambios.push({nombre:p.nombre,antes:Number(p.costo),ahora:cu});
            p.costo=cu;
          }
          if(l.precio!==''&&num(l.precio)>0) p.precio=num(l.precio);
          const upb=Math.max(1,l.porBulto||1);
          const motivo='Compra a proveedor'+(proveedorFac?' — '+proveedorFac:(p.proveedor?' — '+p.proveedor:''))+(nroFac?' · Comprobante '+nroFac:'')+(upb>1?` (${l.cant} × ${upb}u)`:'');
          movimiento(p.id,'ingreso',unidades,motivo,'',extra);
        });
        guardar();cerrarModal();render();
        aviso(`Ingresaron ${remito.reduce((a,l)=>a+unidadesLinea(l),0)} unidades`,'ok');
        if(cambios.length) resumenCostos(cambios);
      };
    }});
}
function addRemito(id){
  const y=remito.find(l=>l.prodId===id);
  if(y) y.cant++; else{ remito.push({prodId:id,cant:1,porBulto:1,costoU:'',totalL:'',descuento:0,precio:''}); }
  recomputeLinea(remito.find(l=>l.prodId===id));
  pintarRemito();
}

/* ─── lectura automática de la foto de una factura ─── */
const PROMPT_FACTURA=`Sos un asistente que lee remitos, facturas y tickets de compra de un kiosco argentino a partir de una foto.
Devolvé SOLO un JSON válido, sin texto adicional, sin explicación, sin backticks, con exactamente esta forma:
{"proveedor":"","nroComprobante":"","total":0,"items":[{"producto":"","cantidad":0,"precioUnit":0,"unidadesPorBulto":1,"descuento":0}]}
Reglas:
- Recorré la tabla de ítems fila por fila, uno por cada renglón, sin saltear ninguno.
- "producto" es el nombre del artículo tal como figura, sin el precio ni la cantidad.
- "cantidad" y "precioUnit": en muchos tickets la cantidad y el precio unitario aparecen en la línea de ARRIBA del nombre del producto, con el formato "8,0000 (00) x 2300,0000" y el importe total de esa fila a la derecha del nombre. En ese caso, cantidad=8 y precioUnit=2300.
- "unidadesPorBulto": SOLO poné un número mayor a 1 si el texto indica EXPLÍCITAMENTE unidades por bulto con la letra U o la palabra unidades: "X 6U", "X 12U", "X 24 UN", "PACK X 6", "CAJA X 12". En CUALQUIER otro caso poné 1. MUY IMPORTANTE: los números que forman parte del nombre o del sabor del producto NO son unidades por bulto. Ejemplos: "DR.LEMON VODKA LATA X47*473ML" → unidadesPorBulto = 1 (el "X47" es parte del nombre del producto y "473ML" es el contenido de la lata). "COCA COLA X 500CC X 6U" → unidadesPorBulto = 6. Ante la duda, poné 1.
- "descuento": si más abajo en el comprobante hay una línea de descuento para ese producto (empieza con "DTO.", "DESC", "DESCUENTO" o "BONIF" seguida del nombre del producto y un importe negativo), poné acá ese importe como número POSITIVO. Si no hay descuento para ese producto, poné 0. No crees un ítem aparte para las líneas de descuento: aplicalas al producto que corresponde.
- "cantidad", "precioUnit", "unidadesPorBulto", "descuento" y "total" son números con punto decimal (nunca coma ni separador de miles), sin el símbolo $.
- "proveedor" es la razón social o nombre comercial que emite el comprobante. "nroComprobante" es el número de remito, factura o ticket.
- No inventes ítems que no estén en la foto. Si un dato no se lee, dejalo vacío o en 0.`;

// Detecta unidades por bulto SOLO cuando está explícito ("X 6U", "PACK X 12", "CAJA X 24 UN").
// Nunca interpreta números sueltos del nombre (ej: "DR.LEMON X47*473ML" → 1).
function detectarBulto(nombre){
  const s=String(nombre||'');
  let m = s.match(/\bx\s*(\d{1,3})\s*(?:u|un|uni|unid|unidades)\b/i)
       || s.match(/\b(?:pack|caja|bulto|display|blister)\s*(?:x|de)?\s*(\d{1,3})\b/i);
  const n=m?parseInt(m[1],10):1;
  return (n>=2&&n<=144)?n:1;
}

function fileABase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]);
    r.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    r.readAsDataURL(file);
  });
}
function numFactura(v){
  if(typeof v==='number') return v;
  if(v==null) return 0;
  let s=String(v).trim().replace(/[^\d,.\-]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function normalizarTexto(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function coincidenciaProducto(nombreExtraido){
  const q=normalizarTexto(nombreExtraido);
  if(!q) return null;
  const qWords=q.split(' ').filter(w=>w.length>1);
  let mejor=null, mejorScore=0;
  db.productos.forEach(p=>{
    const n=normalizarTexto(p.nombre);
    if(!n) return;
    const nWords=n.split(' ');
    let score = n===q ? 10 : 0;
    qWords.forEach(w=>{ if(nWords.includes(w)) score+=2; else if(n.includes(w)) score+=1; });
    if(score>mejorScore){ mejorScore=score; mejor=p; }
  });
  return mejorScore>=2 ? mejor : null;
}

async function leerFacturaFoto(file,ov){
  const label=$('#facFotoLabel',ov);
  const original=label.innerHTML;
  label.innerHTML='Leyendo la foto…';
  label.style.pointerEvents='none';
  label.style.opacity='.7';
  try{
    const b64=await fileABase64(file);
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:2000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},
          {type:'text',text:PROMPT_FACTURA}
        ]}]
      })
    });
    if(!resp.ok) throw new Error('La API respondió '+resp.status);
    const data=await resp.json();
    const texto=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const match=texto.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('Sin JSON en la respuesta');
    const parsed=JSON.parse(match[0]);
    if(!parsed.items||!parsed.items.length){ aviso('No pude reconocer productos en esa foto','bad'); return; }
    abrirRevisionFactura(parsed);
  }catch(e){
    console.error(e);
    aviso('No pude leer la factura automáticamente. Cargala a mano abajo.','bad');
  }finally{
    if(document.body.contains(label)){ label.innerHTML=original; label.style.pointerEvents=''; label.style.opacity=''; }
  }
}

let revisionFactura=[];
function abrirRevisionFactura(parsed){
  revisionFactura=parsed.items.map(it=>{
    const m=coincidenciaProducto(it.producto);
    const upb=Math.max(1,Math.floor(numFactura(it.unidadesPorBulto))||detectarBulto(it.producto));
    return {original:(it.producto||'').trim()||'(sin nombre)', cantidad:Math.max(0,numFactura(it.cantidad))||1,
            costoU:numFactura(it.precioUnit), descuento:Math.abs(numFactura(it.descuento)), porBulto:upb, prodId:m?m.id:''};
  });
  modal({titulo:'Revisá lo que leímos de la factura', ancho:true,
    cuerpo:`
      <p style="margin:0 0 14px;color:var(--muted);line-height:1.6">Así entendimos la foto. <b>"Unid. por bulto"</b> es cuántas unidades sueltas trae cada caja o pack (dejalo en 1 si se compran sueltas). El <b>descuento</b> es el total bonificado de esa fila, y se reparte entre las unidades. Revisá todo antes de confirmar.</p>
      <div id="revTabla"></div>`,
    pie:`<button class="btn ghost" data-cerrar>Descartar</button><button class="btn verde" id="okRev">Cargar a la factura</button>`,
    alAbrir:ov2=>{
      pintarRevision(ov2);
      $('#okRev',ov2).onclick=()=>{
        let creados=0, agregados=0, saltados=0;
        revisionFactura.forEach(r=>{
          if(!r.cantidad||r.cantidad<=0) return;
          const upb=Math.max(1,r.porBulto||1);
          const unidades=r.cantidad*upb;                                  // stock real en unidades sueltas
          const brutoTotal=r.costoU*r.cantidad;                            // lo que suma esa fila antes del descuento
          const netoTotal=Math.max(0,brutoTotal-(r.descuento||0));         // ya con el descuento aplicado
          const costoUnitario=unidades>0? netoTotal/unidades : 0;          // costo real de cada unidad suelta
          let pid=r.prodId;
          if(pid==='__nuevo__'){
            const nuevo={id:uid(),ean:'',nombre:r.original.slice(0,80),rubro:'',proveedor:parsed.proveedor||'',costo:costoUnitario,precio:0,stock:0,stockMin:3,unidad:'unidad'};
            db.productos.push(nuevo);
            pid=nuevo.id; creados++;
          }
          if(!pid){ saltados++; return; }
          const y=remito.find(l=>l.prodId===pid);
          if(y){ y.cant+=unidades; if(costoUnitario>0) y.costoU=String(costoUnitario); recomputeLinea(y); }
          else{ remito.push({prodId:pid,cant:unidades,porBulto:1,costoU:costoUnitario>0?String(costoUnitario):'',totalL:'',descuento:0,precio:''}); recomputeLinea(remito[remito.length-1]); }
          agregados++;
        });
        remitoHeader={
          proveedor: parsed.proveedor? String(parsed.proveedor).trim() : remitoHeader.proveedor,
          nroComprobante: parsed.nroComprobante? String(parsed.nroComprobante).trim() : remitoHeader.nroComprobante,
          total: numFactura(parsed.total)>0? numFactura(parsed.total).toFixed(2) : remitoHeader.total
        };
        cerrarModal();
        panelIngreso(false);
        aviso(`Cargamos ${agregados} productos de la factura${creados?` · ${creados} nuevos, ponéles precio de venta`:''}${saltados?` · ${saltados} sin elegir`:''}`, saltados?'bad':'ok');
      };
    }});
}

function recomputeLinea(l){
  if(l.costoU!=='') l.totalL=l.cant>0?(num(l.costoU)*l.cant).toFixed(2):'';
  else if(l.totalL!=='') l.costoU=l.cant>0?(num(l.totalL)/l.cant).toFixed(4):'';
}
// costo de UNA unidad suelta: (precio × cantidad − descuento) ÷ unidades totales
function costoLinea(l,p){
  const un=unidadesLinea(l);
  if(un<=0) return null;
  let bruto=null;
  if(l.costoU!=='') bruto=num(l.costoU)*l.cant;
  else if(l.totalL!=='') bruto=num(l.totalL);
  if(bruto===null) return null;
  const neto=Math.max(0,bruto-Math.abs(num(l.descuento||0)));
  return neto/un;
}
function unidadesLinea(l){ return l.cant*Math.max(1,l.porBulto||1); }
function pintarRemito(){
  const c=$('#iTabla'); if(!c) return;
  if(!remito.length){ c.innerHTML=`<div class="empty" style="padding:26px"><b>Todavía no cargaste la factura</b>Cada producto que escanees se suma acá.</div>`; $('#iTot').textContent=''; $('#iCheck').innerHTML=''; return; }
  c.innerHTML=`<table class="mtable"><thead><tr><th>Producto</th><th style="width:105px">Cantidad</th><th style="width:90px">Unid. x bulto</th><th style="width:115px">Precio unit.</th><th style="width:110px">Descuento</th><th style="width:110px">Venta nueva</th><th>Se carga</th><th></th></tr></thead><tbody>
    ${remito.map((l,ix)=>{
      const p=prod(l.prodId);const kg=p.unidad==='kg';
      const upb=Math.max(1,l.porBulto||1);
      const un=unidadesLinea(l);
      const cu=costoLinea(l,p);
      return `<tr>
      <td data-label="Producto"><b>${esc(p.nombre)}</b>${kg?' <span class="pill info">kg</span>':''}<br><span style="font-size:12px;color:var(--muted)">stock ${fmtCant(p,p.stock)} → <b>${fmtCant(p,p.stock+un)}</b> · costo actual ${$m(p.costo)}${kg?'/kg':''}</span></td>
      <td data-label="Cantidad"><div class="qty"><button data-rm="${ix}" aria-label="Restar">–</button><input class="num" data-rc="${ix}" value="${l.cant}"><button data-ra="${ix}" aria-label="Sumar">+</button></div>${kg?'<div style="font-size:11px;color:var(--muted);margin-top:3px">kg</div>':''}</td>
      <td data-label="Unid. x bulto"><input class="inp num" data-rbulto="${ix}" value="${upb}" ${kg?'disabled':''}></td>
      <td data-label="Precio unit."><input class="inp num" data-rcostou="${ix}" placeholder="${nfM.format(p.costo*upb)}" value="${l.costoU}"></td>
      <td data-label="Descuento"><input class="inp num" data-rdto="${ix}" placeholder="0" value="${l.descuento||''}"></td>
      <td data-label="Venta nueva"><input class="inp num" data-rprecio="${ix}" placeholder="${nfM.format(p.precio)}" value="${l.precio}"></td>
      <td data-label="Se carga"><b class="num">${fmtCant(p,un)}</b>${cu!==null?`<br><span style="font-size:12px;color:var(--muted)">a ${$m(cu)} c/u</span><br>${pillVariacion(p.costo,cu)}`:''}</td>
      <td class="r"><button class="x" data-rx="${ix}" aria-label="Sacar de la factura">${ic('cerrar')}</button></td></tr>`;}).join('')}</tbody></table>`;
  const costoTot=remito.reduce((a,l)=>{const p=prod(l.prodId);const cu=costoLinea(l,p);return a+unidadesLinea(l)*(cu!==null?cu:Number(p.costo)||0);},0);
  $('#iTot').innerHTML=`${remito.length} productos · ${remito.reduce((a,l)=>a+unidadesLinea(l),0)} unidades · costo total <b class="num">${$m(costoTot)}</b>`;
  const facTotal=$('#facTotal'); const chk=$('#iCheck');
  if(facTotal&&chk){
    const declarado=num(facTotal.value);
    chk.innerHTML = (facTotal.value.trim()==='') ? '' : Math.abs(declarado-costoTot)<1
      ? `<span class="pill ok">Coincide con el total de la factura</span>`
      : `<span class="pill bad">No coincide: cargaste ${$m(costoTot)} y la factura dice ${$m(declarado)} · diferencia ${$m(Math.abs(declarado-costoTot))}</span>`;
  }
  const redondear=n=>Math.round(n*1000)/1000;
  $$('[data-rbulto]').forEach(i=>i.onchange=()=>{const l=remito[i.dataset.rbulto];l.porBulto=Math.max(1,Math.floor(num(i.value))||1);pintarRemito();});
  $$('[data-ra]').forEach(b=>{const l=remito[b.dataset.ra];const p=prod(l.prodId);b.onclick=()=>{l.cant=redondear(l.cant+(p.unidad==='kg'?0.1:1));recomputeLinea(l);pintarRemito();};});
  $$('[data-rm]').forEach(b=>{const l=remito[b.dataset.rm];const p=prod(l.prodId);b.onclick=()=>{const paso=p.unidad==='kg'?0.1:1;l.cant=redondear(l.cant-paso);if(l.cant<=0.0009){remito.splice(b.dataset.rm,1);}else recomputeLinea(l);pintarRemito();};});
  $$('[data-rx]').forEach(b=>b.onclick=()=>{remito.splice(b.dataset.rx,1);pintarRemito();});
  $$('[data-rc]').forEach(i=>{const l=remito[i.dataset.rc];const p=prod(l.prodId);i.onchange=()=>{l.cant=p.unidad==='kg'?Math.max(0.001,redondear(num(i.value))):Math.max(1,Math.floor(num(i.value)));recomputeLinea(l);pintarRemito();};});
  $$('[data-rcostou]').forEach(i=>i.onchange=()=>{const l=remito[i.dataset.rcostou];l.costoU=i.value;l.totalL=i.value!==''?(num(i.value)*l.cant).toFixed(2):'';pintarRemito();});
  $$('[data-rdto]').forEach(i=>i.onchange=()=>{const l=remito[i.dataset.rdto];l.descuento=Math.abs(num(i.value));pintarRemito();});
  $$('[data-rprecio]').forEach(i=>i.onchange=()=>{remito[i.dataset.rprecio].precio=i.value;});
}

  const l=db.productos.filter(seRepone);
  const c=$('#repCont');
  if(!l.length){ c.innerHTML=`<div class="card"><div class="empty"><b>No falta nada</b>Cuando un producto toque su stock mínimo aparece acá, con cuánto pedir para volver al deseado.</div></div>`; return; }
  if(repOrden==='falta'){
    l.sort((a,b)=>(a.stock-a.stockMin)-(b.stock-b.stockMin));
    c.innerHTML=`<div class="card">${tablaRep(l)}</div>`;
  }else{
    const campo=repOrden;
    const grupos={};
    l.forEach(p=>{const k=p[campo]||'Sin '+campo;(grupos[k]=grupos[k]||[]).push(p);});
    c.innerHTML=Object.keys(grupos).sort().map(k=>{
      const g=grupos[k].sort((a,b)=>a.nombre.localeCompare(b.nombre));
      const costoG=g.reduce((a,p)=>a+faltante(p)*(Number(p.costo)||0),0);
      return `<div class="card" style="margin-bottom:16px">
        <div class="card-h"><h2>${esc(k)}</h2>
          <div class="row"><span class="pill mute">${g.length} productos · ${$m(costoG)} estimado</span>
          <button class="btn ghost sm" data-grupo="${esc(k)}">Agregar todo al pedido</button></div></div>
        ${tablaRep(g)}</div>`;
    }).join('');
    $$('[data-grupo]').forEach(b=>b.onclick=()=>{
      const campo=repOrden;
      db.productos.filter(seRepone).filter(p=>(p[campo]||'Sin '+campo)===b.dataset.grupo)
        .forEach(p=>{ if(faltante(p)>0) pedido[p.id]=faltante(p); });
      render(); aviso('Productos agregados al pedido','ok');
    });
  }
}
function tablaRep(l){
  const otra=repOrden==='proveedor'?'Rubro':'Proveedor';
  return `<table class="mtable"><thead><tr><th>Producto</th><th>${otra}</th><th class="r">Stock</th><th class="r">Mínimo</th><th class="r">Deseado</th><th class="r">Pedir</th><th class="r">Costo estimado</th></tr></thead><tbody>
  ${l.map(p=>`<tr>
    <td data-label="Producto"><b>${esc(p.nombre)}</b>${p.unidad==='kg'?' <span class="pill info">kg</span>':''}${pedido[p.id]>0?' <span class="pill ok">en el pedido</span>':''}</td>
    <td data-label="${otra}" style="color:var(--muted)">${esc((repOrden==='proveedor'?p.rubro:p.proveedor)||'—')}</td>
    <td data-label="Stock" class="r"><span class="pill ${p.stock<=0?'bad':'warn'} num">${fmtCant(p,p.stock)}</span></td>
    <td data-label="Mínimo" class="r num" style="color:var(--muted)">${fmtCant(p,p.stockMin)}</td>
    <td data-label="Deseado" class="r num" style="color:var(--muted)">${fmtCant(p,deseado(p))}</td>
    <td data-label="Pedir" class="r num" style="font-weight:600">${fmtCant(p,faltante(p))}</td>
    <td data-label="Costo estimado" class="r num" style="color:var(--muted)">${$m(faltante(p)*(Number(p.costo)||0))}</td>
  </tr>`).join('')}</tbody></table>`;
}

/* ── armador de pedido ── */
function abrirPedido(){
  // arranca con todo lo que está bajo el mínimo, salvo que ya hayas armado algo antes
  if(!Object.keys(pedido).length){
    db.productos.filter(seRepone).forEach(p=>{ if(faltante(p)>0) pedido[p.id]=faltante(p); });
  }
  modal({titulo:'Pedido a proveedores', ancho:true,
    cuerpo:`
      <p style="margin:0 0 14px;color:var(--muted);line-height:1.6">Las cantidades salen de lo que falta para llegar al <b>stock deseado</b> de cada producto. Ajustá lo que quieras antes de mandarlo.</p>
      <div id="pedCuerpo"></div>`,
    pie:`<div style="margin-right:auto;color:var(--muted)" id="pedTot"></div>
         <button class="btn ghost" id="pedVaciar">Vaciar</button>
         <button class="btn ghost" id="pedCopiar">Copiar</button>
         <button class="btn verde" id="pedWa">Enviar por WhatsApp</button>`,
    alAbrir:ov=>{
      pintarPedido(ov);
      $('#pedVaciar',ov).onclick=()=>{pedido={};pintarPedido(ov);};
      $('#pedCopiar',ov).onclick=()=>{
        const t=textoPedido();
        navigator.clipboard?.writeText(t).then(()=>aviso('Pedido copiado','ok'),
          ()=>modal({titulo:'Pedido',cuerpo:`<textarea class="inp" rows="12" style="font-family:var(--mono)">${esc(t)}</textarea>`,pie:`<button class="btn ghost" data-cerrar>Cerrar</button>`}));
      };
      $('#pedWa',ov).onclick=()=>{
        const lineas=lineasPedido();
        if(!lineas.length){aviso('El pedido está vacío','bad');return;}
        window.open('https://wa.me/?text='+encodeURIComponent(textoPedido()),'_blank');
      };
    }});
}
function lineasPedido(){
  return Object.keys(pedido).filter(k=>pedido[k]>0)
    .map(k=>({p:prod(k),cant:pedido[k]})).filter(x=>x.p)
    .sort((a,b)=>(a.p.proveedor||'zzz').localeCompare(b.p.proveedor||'zzz')||a.p.nombre.localeCompare(b.p.nombre));
}
function pintarPedido(ov){
  const cont=$('#pedCuerpo',ov);
  const lineas=lineasPedido();
  if(!lineas.length){
    cont.innerHTML=`<div class="empty" style="padding:30px"><b>El pedido está vacío</b>Volvé al listado y agregá productos, o cerrá y abrí de nuevo para recargar los que están bajo el mínimo.</div>`;
    $('#pedTot').textContent=''; return;
  }
  // agrupado por proveedor, que es como se manda en la práctica
  const porProv={};
  lineas.forEach(x=>{const k=x.p.proveedor||'Sin proveedor';(porProv[k]=porProv[k]||[]).push(x);});
  cont.innerHTML=Object.keys(porProv).sort().map(prov=>{
    const g=porProv[prov];
    const sub=g.reduce((a,x)=>a+x.cant*(Number(x.p.costo)||0),0);
    return `<div class="card" style="margin-bottom:14px">
      <div class="card-h"><h2>${esc(prov)}</h2><span class="pill mute">${g.length} productos · ${$m(sub)}</span></div>
      <table class="mtable"><thead><tr><th>Producto</th><th style="width:130px">Cantidad</th><th class="r">Costo unit.</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>
        ${g.map(x=>`<tr>
          <td data-label="Producto"><b>${esc(x.p.nombre)}</b><br><span style="font-size:12px;color:var(--muted)">tenés ${fmtCant(x.p,x.p.stock)} · querés llegar a ${fmtCant(x.p,deseado(x.p))}</span></td>
          <td data-label="Cantidad"><div class="qty">
            <button data-pm="${x.p.id}" aria-label="Restar">–</button>
            <input class="num" data-pc="${x.p.id}" value="${x.cant}">
            <button data-pp="${x.p.id}" aria-label="Sumar">+</button></div></td>
          <td data-label="Costo unit." class="r num" style="color:var(--muted)">${$m(x.p.costo)}</td>
          <td data-label="Subtotal" class="r num" style="font-weight:600">${$m(x.cant*(Number(x.p.costo)||0))}</td>
          <td class="r"><button class="x" data-px="${x.p.id}" aria-label="Sacar del pedido">${ic('cerrar')}</button></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  }).join('');
  const total=lineas.reduce((a,x)=>a+x.cant*(Number(x.p.costo)||0),0);
  const unidades=lineas.reduce((a,x)=>a+x.cant,0);
  $('#pedTot').innerHTML=`${lineas.length} productos · ${nfKg.format(unidades)} unidades · <b class="num">${$m(total)}</b> estimado`;
  const paso=p=>p.unidad==='kg'?0.5:1;
  const red=n=>Math.round(n*1000)/1000;
  $$('[data-pp]',cont).forEach(b=>b.onclick=()=>{const p=prod(b.dataset.pp);pedido[b.dataset.pp]=red(pedido[b.dataset.pp]+paso(p));pintarPedido(ov);});
  $$('[data-pm]',cont).forEach(b=>b.onclick=()=>{const p=prod(b.dataset.pm);const n=red(pedido[b.dataset.pm]-paso(p));if(n<=0)delete pedido[b.dataset.pm];else pedido[b.dataset.pm]=n;pintarPedido(ov);});
  $$('[data-px]',cont).forEach(b=>b.onclick=()=>{delete pedido[b.dataset.px];pintarPedido(ov);});
  $$('[data-pc]',cont).forEach(i=>i.onchange=()=>{
    const p=prod(i.dataset.pc);
    const n=p.unidad==='kg'?red(num(i.value)):Math.floor(num(i.value));
    if(n<=0) delete pedido[i.dataset.pc]; else pedido[i.dataset.pc]=n;
    pintarPedido(ov);
  });
}
function textoPedido(){
  const lineas=lineasPedido();
  const porProv={};
  lineas.forEach(x=>{const k=x.p.proveedor||'Sin proveedor';(porProv[k]=porProv[k]||[]).push(x);});
  const out=[`*Pedido — ${db.config.nombre}*`,fFecha(Date.now()),''];
  Object.keys(porProv).sort().forEach(prov=>{
    out.push(`*${prov}*`);
    porProv[prov].forEach(x=>out.push(`• ${x.p.nombre} — ${x.p.unidad==='kg'?fmtCant(x.p,x.cant):x.cant+' u.'}`));
    out.push('');
  });
  const total=lineas.reduce((a,x)=>a+x.cant*(Number(x.p.costo)||0),0);
  out.push(`Estimado: ${$m(total)}`);
  return out.join('\n');
}

function tablaClientes(q){

function verCuenta(id){
  const c=cli(id);
  const montoFiado=v=> v.forma==='mixto' ? (v.pagos.find(p=>p.forma==='fiado')||{}).monto||0 : v.total;
  const mov=[
    ...db.ventas.filter(v=>v.clienteId===id).map(v=>({f:v.fecha,t:'fiado',m:montoFiado(v),d:`Venta Nº${v.nro}${v.forma==='mixto'?' (parte del pago combinado)':''} · ${v.items.length} productos`,items:v.items})),
    ...db.pagos.filter(p=>p.clienteId===id).map(p=>({f:p.fecha,t:'pago',m:-p.monto,d:p.nota||'Pago recibido',forma:p.forma||'efectivo'})),
    ...(db.ajustesFiado||[]).filter(a=>a.clienteId===id).map(a=>({f:a.fecha,t:'ajuste',m:a.monto,d:a.motivo||'Ajuste de saldo'}))
  ].sort((a,b)=>b.f.localeCompare(a.f));
  const totalFiado=mov.filter(m=>m.t==='fiado').reduce((a,m)=>a+m.m,0);
  const totalPagos=-mov.filter(m=>m.t==='pago').reduce((a,m)=>a+m.m,0);
  modal({titulo:'Cuenta de '+c.nombre, ancho:true,
    cuerpo:`
      <div class="grid3" style="margin-bottom:18px">
        <div class="kpi"><span>Saldo</span><b style="color:${Number(c.saldo)>0.009?'var(--rojo)':'var(--verde)'}">${$m(c.saldo||0)}</b></div>
        <div class="kpi"><span>Compró fiado</span><b>${$m(totalFiado)}</b></div>
        <div class="kpi"><span>Pagó</span><b>${$m(totalPagos)}</b></div>
      </div>
      ${mov.length?`<table class="mtable"><thead><tr><th>Cuándo</th><th>Concepto</th><th class="r">Monto</th></tr></thead><tbody>
        ${mov.map(m=>`<tr>
          <td data-label="Cuándo" class="num" style="font-size:12.5px">${fFH(m.f)}</td>

            :m.t==='ajuste'?`<span class="pill info">Ajuste</span> ${esc(m.d)}`
            :`<span class="pill ok">Pago · ${esc(FORMAS[m.forma]||'Efectivo')}</span> ${esc(m.d)}`}</td>
          <td data-label="Monto" class="r num" style="font-weight:600;color:${m.m<0?'var(--verde)':'var(--txt)'}">${m.m<0?'–':''}${$m(Math.abs(m.m))}</td>
        </tr>`).join('')}</tbody></table>`
      :`<div class="empty"><b>Sin movimientos</b>Todavía no compró fiado ni registró pagos.</div>`}`,
    pie:`<button class="btn ghost" id="edC" style="margin-right:auto">Editar datos</button>

        <button class="btn ghost" data-cerrar>Cerrar</button>

const MOTIVOS_AJUSTE_SALDO=['Deuda anterior al sistema','Corrección de un error de carga','Deuda perdonada','Otro'];
function formAjusteSaldo(id){
  const c=cli(id);
  modal({titulo:'Ajustar saldo — '+c.nombre,
    cuerpo:`
      <div class="kpi" style="margin-bottom:16px"><span>Saldo actual</span><b style="color:${Number(c.saldo)>0.009?'var(--rojo)':'var(--verde)'}">${$m(c.saldo||0)}</b></div>
      <p style="margin:0 0 14px;color:var(--muted);line-height:1.6">Sirve para cargar lo que ya te debía de antes, o para corregir un error. Queda registrado en el historial con el motivo.</p>
      <label class="f">Qué querés hacer</label>
      <div class="seg" style="margin-bottom:14px">
        <button type="button" data-ta="sumar" class="on">Sumar deuda</button>
        <button type="button" data-ta="restar">Restar deuda</button>
        <button type="button" data-ta="fijar">Fijar el saldo</button>
      </div>
      <label class="f" for="as_monto" id="as_lbl">Cuánto sumar a la deuda</label>
      <input id="as_monto" class="inp num" inputmode="decimal" placeholder="0,00">
      <label class="f" for="as_mot" style="margin-top:14px">Motivo</label>
      <select id="as_mot" class="inp">${MOTIVOS_AJUSTE_SALDO.map(m=>`<option>${m}</option>`).join('')}</select>
      <label class="f" for="as_nota" style="margin-top:14px">Detalle</label>
      <input id="as_nota" class="inp" placeholder="Opcional: desde cuándo, por qué…">
      <div id="as_queda" style="margin-top:14px;color:var(--muted)"></div>`,
    pie:`<button class="btn ghost" data-cerrar>Cancelar</button><button class="btn" id="okAS">Guardar ajuste</button>`,
    alAbrir:ov=>{
      let modo='sumar';
      const inp=$('#as_monto',ov);
      const nuevoSaldo=()=>{
        const v=num(inp.value), act=Number(c.saldo||0);
        return modo==='sumar'? act+v : modo==='restar'? act-v : v;
      };
      const upd=()=>{
        const n=nuevoSaldo();
        $('#as_queda',ov).innerHTML = inp.value.trim()===''?'':`El saldo pasa de <b class="num">${$m(c.saldo||0)}</b> a <b class="num" style="color:${n>0.009?'var(--rojo)':'var(--verde)'}">${$m(n)}</b>`;
      };
      $$('[data-ta]',ov).forEach(b=>b.onclick=()=>{
        modo=b.dataset.ta; $$('[data-ta]',ov).forEach(x=>x.classList.toggle('on',x===b));
        $('#as_lbl',ov).textContent = modo==='sumar'?'Cuánto sumar a la deuda':modo==='restar'?'Cuánto restar de la deuda':'Saldo real que debe quedar';
        upd();
      });
      inp.oninput=upd; inp.focus();
      $('#okAS',ov).onclick=()=>{
        if(inp.value.trim()===''){aviso('Ingresá un monto','bad');return;}
        const anterior=Number(c.saldo||0);
        const n=nuevoSaldo();
        const delta=n-anterior;
        if(Math.abs(delta)<0.005){aviso('No hay diferencia para registrar','bad');return;}
        if(n<-0.005){aviso('El saldo no puede quedar negativo','bad');return;}
        const motivo=$('#as_mot',ov).value+($('#as_nota',ov).value.trim()?' — '+$('#as_nota',ov).value.trim():'');
        db.ajustesFiado=db.ajustesFiado||[];
        db.ajustesFiado.push({id:uid(),clienteId:id,monto:delta,motivo,anterior,nuevo:n,fecha:new Date().toISOString()});
        c.saldo=n;
        guardar();cerrarModal();render();
        aviso(`Saldo ajustado: ${delta>0?'+':''}${$m(Math.abs(delta))} · queda en ${$m(n)}`,'ok');
      };
    }});
}
function formPago(id){
  const c=cli(id);
  let formaPago='efectivo';
  modal({titulo:'Cobrar a '+c.nombre,
    cuerpo:`
      <div class="kpi" style="margin-bottom:16px"><span>Debe</span><b style="color:var(--rojo)">${$m(c.saldo)}</b></div>
      <label class="f">¿Cómo te paga?</label>
      <div class="seg" style="margin-bottom:14px">

function turnoActual(){
  const ult=db.cierres.length? db.cierres[db.cierres.length-1].hasta : null;
  const desde = ult || (db.ventas[0]? db.ventas[0].fecha : new Date().toISOString());
  const ventas=db.ventas.filter(v=>v.fecha>desde||!ult&&v.fecha>=desde);
  const pagos=db.pagos.filter(p=>p.fecha>desde||!ult&&p.fecha>=desde);
  const egresos=(db.egresos||[]).filter(e=>e.fecha>desde||!ult&&e.fecha>=desde);

  const porForma={efectivo:0,transferencia:0,tarjeta:0,fiado:0};
  let cigTotal=0, cigEfectivo=0, costo=0;
  ventas.forEach(v=>{
    let cig=0;
    (v.items||[]).forEach(i=>{
      costo+=(i.costo||0)*i.cant;
      if(i.tipo==='combo'){ if((i.componentes||[]).some(c=>esCigarrillo(c.rubro))) cig+=i.precio*i.cant; }
      else if(esCigarrillo(i.rubro)) cig+=i.precio*i.cant;
    });
    cigTotal+=cig;
    if(v.pagos&&v.pagos.length){
      v.pagos.forEach(pg=>{
        const fk=formaKey(pg.forma);
        porForma[fk]=(porForma[fk]||0)+pg.monto;
        if(fk==='efectivo'&&v.total>0) cigEfectivo+=pg.monto*(cig/v.total);
      });
    } else {
      const fk=formaKey(v.forma);
      porForma[fk]=(porForma[fk]||0)+v.total;
      if(v.forma==='efectivo') cigEfectivo+=cig;
    }
  });
  const cobEfectivo=pagos.filter(p=>(p.forma||'efectivo')==='efectivo').reduce((a,p)=>a+p.monto,0);
  const cobOtros=pagos.filter(p=>(p.forma||'efectivo')!=='efectivo').reduce((a,p)=>a+p.monto,0);
  const egrEfectivo=egresos.filter(e=>(e.forma||'efectivo')==='efectivo');
  const egrGeneral=egrEfectivo.filter(e=>e.caja!=='cigarrillos').reduce((a,e)=>a+e.monto,0);
  const egrCigarros=egrEfectivo.filter(e=>e.caja==='cigarrillos').reduce((a,e)=>a+e.monto,0);
  const egrOtros=egresos.filter(e=>(e.forma||'efectivo')!=='efectivo').reduce((a,e)=>a+e.monto,0);
  const genEfectivo=porForma.efectivo-cigEfectivo;
  const total=Object.values(porForma).reduce((a,b)=>a+b,0);
  return {desde,ventas,pagos,egresos,porForma,cigTotal,cigEfectivo,genEfectivo,cobEfectivo,cobOtros,egrGeneral,egrCigarros,egrOtros,costo,total};
}
function ventasDeCierre(c){
  if(c.ventaIds) return c.ventaIds.map(id=>db.ventas.find(v=>v.id===id)).filter(Boolean);
  return db.ventas.filter(v=>v.fecha>c.desde&&v.fecha<=c.hasta); // cierres guardados antes de esta versión
}

function textoResumenCierre(c){
  const l=[];
  l.push(`*Cierre de caja — ${db.config.nombre}*`);
  l.push(fFH(c.hasta));
  l.push('');
  l.push(`Ventas: ${c.cantVentas}`);
  l.push(`Total vendido: ${$m(c.total)}`);
  l.push('');
  l.push('*Por forma de pago*');
  Object.keys(c.porForma||{}).forEach(f=>{ if(c.porForma[f]>0.009) l.push(`${FORMAS[f]||f}: ${$m(c.porForma[f])}`); });
  if(c.cigTotal>0.009) l.push(`Cigarrillos vendidos: ${$m(c.cigTotal)}`);
  if((c.egrGeneral||0)+(c.egrCigarros||0)>0.009){
    l.push('');
    l.push('*Egresos*');
    if(c.egrGeneral>0.009) l.push(`De caja general: ${$m(c.egrGeneral)}`);
    if(c.egrCigarros>0.009) l.push(`De caja cigarrillos: ${$m(c.egrCigarros)}`);
  }
  l.push('');
  l.push('*Caja general*');
  l.push(`Debería haber: ${$m(c.esperadoGeneral)}`);
  l.push(`Contado: ${$m(c.contadoGeneral)}`);
  l.push(`Diferencia: ${c.diferenciaGeneral>=0?'+':''}${$m(c.diferenciaGeneral)}`);
  l.push('');
  l.push('*Caja de cigarrillos*');
  l.push(`Debería haber: ${$m(c.esperadoCigarros)}`);
  l.push(`Contado: ${$m(c.contadoCigarros)}`);
  l.push(`Diferencia: ${c.diferenciaCigarros>=0?'+':''}${$m(c.diferenciaCigarros)}`);
  if(c.nota) { l.push(''); l.push(`Nota: ${c.nota}`); }
  return l.join('\n');
}

async function backupAuto(){
  const ok=await sSet(BKP,JSON.stringify({fecha:new Date().toISOString(),db}));
  if(ok){ db.config.ultBackup=new Date().toISOString(); guardar(); }
  return ok;
}
function descargarBackup(){
  const datos={app:'mostrador-kiosco',version:1,fecha:new Date().toISOString(),db};
  const blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`kiosco-${hoy()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  aviso('Copia descargada','ok');
}
function restaurar(obj,origen){
  const d=obj.db||obj;
  if(!d||!Array.isArray(d.productos)){aviso('Ese archivo no es una copia válida','bad');return;}
  confirmar('Restaurar copia',
    `Vas a reemplazar todo lo que hay ahora por la copia ${origen}: <b>${d.productos.length}</b> productos, <b>${(d.ventas||[]).length}</b> ventas y <b>${(d.clientes||[]).length}</b> clientes. Lo actual se pierde.`,
    ()=>{ db={...VACIA(),...d,config:{...VACIA().config,...(d.config||{})}}; guardar(); ticket=[]; render(); aviso('Copia restaurada','ok'); },
    'Restaurar');
}

let periodoResumen='hoy', desdePers='', hastaPers='';

function rangoPeriodo(p){
  const ahora=new Date();
  const ini=new Date(ahora); ini.setHours(0,0,0,0);
  const fin=new Date(ahora); fin.setHours(23,59,59,999);
  if(p==='ayer'){ ini.setDate(ini.getDate()-1); fin.setDate(fin.getDate()-1); }
  else if(p==='semana'){ ini.setDate(ini.getDate()-6); }
  else if(p==='mes'){ ini.setDate(ini.getDate()-29); }
  else if(p==='pers'){
    if(desdePers) { const d=new Date(desdePers+'T00:00:00'); if(!isNaN(d)) ini.setTime(d.getTime()); }
    if(hastaPers) { const h=new Date(hastaPers+'T23:59:59'); if(!isNaN(h)) fin.setTime(h.getTime()); }
  }
  return {ini:ini.toISOString(),fin:fin.toISOString()};
}
function datosPeriodo(p){
  const {ini,fin}=rangoPeriodo(p);
  const ventas=db.ventas.filter(v=>v.fecha>=ini&&v.fecha<=fin);
  const pagos=db.pagos.filter(x=>x.fecha>=ini&&x.fecha<=fin);
  const egresos=(db.egresos||[]).filter(e=>e.fecha>=ini&&e.fecha<=fin);
  const porForma={efectivo:0,transferencia:0,tarjeta:0,fiado:0};
  const porHora=Array(24).fill(0), porHoraCant=Array(24).fill(0);
  const porDiaSemana=Array(7).fill(0);
  const porRubro={}, porProducto={};
  let costo=0, cigTotal=0, cigCosto=0;

  ventas.forEach(v=>{
    if(v.pagos&&v.pagos.length) v.pagos.forEach(pg=>{const k=formaKey(pg.forma);porForma[k]=(porForma[k]||0)+pg.monto;});
    else { const k=formaKey(v.forma); porForma[k]=(porForma[k]||0)+v.total; }
    const f=new Date(v.fecha);
    porHora[f.getHours()]+=v.total; porHoraCant[f.getHours()]+=1;
    porDiaSemana[f.getDay()]+=v.total;

    const sumar=(pid,nombre,cant,importe,rubro)=>{
      const k=pid||('x:'+nombre);
      porProducto[k]=porProducto[k]||{nombre,cant:0,importe:0,pid,rubro:rubro||''};
      porProducto[k].cant+=cant; porProducto[k].importe+=importe;
      const r=(rubro||'Sin rubro').trim()||'Sin rubro';
      porRubro[r]=porRubro[r]||{importe:0,cant:0};
      porRubro[r].importe+=importe; porRubro[r].cant+=cant;
    };
    (v.items||[]).forEach(i=>{
      costo+=(i.costo||0)*i.cant;
      if(i.tipo==='combo'){
        const suma=(i.componentes||[]).reduce((a,x)=>a+(x.precio||0)*x.cant,0)||1;
        (i.componentes||[]).forEach(c=>{
          const pr=prod(c.prodId);
          const rubro=c.rubro||(pr?pr.rubro:'');
          const importe=(c.precio||0)*c.cant*i.cant*(i.precio/suma);   // reparte el precio del combo
          sumar(c.prodId,c.nombre,c.cant*i.cant,importe,rubro);
          if(esCigarrillo(rubro)){ cigTotal+=importe; cigCosto+=(c.costo||0)*c.cant*i.cant; }
        });
      } else {
        const pr=prod(i.prodId);
        const rubro=i.rubro||(pr?pr.rubro:'');
        sumar(i.prodId,i.nombre,i.cant,i.precio*i.cant,rubro);
        if(esCigarrillo(rubro)){ cigTotal+=i.precio*i.cant; cigCosto+=(i.costo||0)*i.cant; }
      }
    });
  });

  const total=Object.values(porForma).reduce((a,b)=>a+b,0);
  const egrTotal=egresos.reduce((a,e)=>a+e.monto,0);
  const cobrado=porForma.efectivo+porForma.transferencia+porForma.tarjeta;
  const productos=Object.values(porProducto).sort((a,b)=>b.importe-a.importe);
  const rubrosOrden=Object.entries(porRubro).map(([k,v])=>({nombre:k,...v})).sort((a,b)=>b.importe-a.importe);
  // margen bruto separado: cigarrillos suele tener un margen mucho más chico que el resto
  const cigMargen=cigTotal-cigCosto;
  const otroTotal=total-cigTotal, otroCosto=costo-cigCosto;
  const otroMargen=otroTotal-otroCosto;
  return {ini,fin,ventas,pagos,egresos,porForma,total,cobrado,costo,egrTotal,
          cigTotal,cigCosto,cigMargen,otroTotal,otroCosto,otroMargen,
          productos,rubros:rubrosOrden,porHora,porHoraCant,porDiaSemana,ganancia:total-costo-egrTotal};
}
function serieDiaria(ini,fin){
  const dias=[]; const d=new Date(ini); d.setHours(0,0,0,0);
  const hasta=new Date(fin);
  while(d<=hasta&&dias.length<62){
    const key=d.toISOString().slice(0,10);
    const tot=db.ventas.filter(v=>v.fecha.slice(0,10)===key).reduce((a,v)=>a+v.total,0);
    dias.push({key,fecha:new Date(d),total:tot});
    d.setDate(d.getDate()+1);
  }
  return dias;
}

    pintarBarrasHora($('#graf'),d.porHora);
    const pico=d.porHora.indexOf(Math.max(...d.porHora));
    $('#grafNota').innerHTML=`<div class="nota-dash">Tu hora más fuerte fue <b>${String(pico).padStart(2,'0')}:00</b>, con ${$m(d.porHora[pico])} en ${d.porHoraCant[pico]} ventas.</div>`;
  } else {
    const serie=serieDiaria(d.ini,d.fin);
    pintarGrafico($('#graf'),serie);
    const mejorDia=d.porDiaSemana.indexOf(Math.max(...d.porDiaSemana));
    const conVentas=serie.filter(s=>s.total>0);
    const prom=conVentas.length?conVentas.reduce((a,s)=>a+s.total,0)/conVentas.length:0;
    $('#grafNota').innerHTML=`<div class="nota-dash">Tu mejor día suele ser el <b>${DIAS_SEM[mejorDia]}</b>. Promediás <b>${$m(prom)}</b> por día con ventas.</div>`;
  }
  pintarRanking($('#rankProd'),d);
  pintarRubros($('#rubrosBox'),d);
}

function pintarBarrasHora(cont,porHora){
  const max=Math.max(...porHora,1);
  const pico=porHora.indexOf(Math.max(...porHora));
  cont.innerHTML=`<div class="graf-horas">
    ${porHora.map((v,h)=>{
      const alt=Math.max(3,(v/max)*130);
      return `<div class="hora-col" title="${String(h).padStart(2,'0')}:00 — ${$m(v)}">
        <div class="hora-barra" style="height:${alt}px;background:${h===pico?'var(--rojo)':v>0?'var(--verde)':'#E2E6EC'}"></div>
      </div>`;}).join('')}
  </div>
  <div class="graf-ejes"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span></div>`;
}

function pintarGrafico(cont,serie){
  if(!serie.length){cont.innerHTML='<div class="empty">Sin datos</div>';return;}
  const max=Math.max(...serie.map(s=>s.total),1);
  const dias=['dom','lun','mar','mié','jue','vie','sáb'];
  const corto=serie.length<=14;
  cont.innerHTML=`<div style="display:flex;align-items:flex-end;gap:${corto?'8px':'3px'};height:165px">
    ${serie.map(s=>{
      const h=Math.max(3,(s.total/max)*135);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0" title="${fFecha(s.fecha)} — ${$m(s.total)}">
        <div style="width:100%;height:${h}px;background:${s.total>0?'var(--primary)':'#E2E6EC'};border-radius:5px 5px 0 0"></div>
        <div style="font-size:10.5px;color:var(--muted);white-space:nowrap">${corto?dias[s.fecha.getDay()]+' '+s.fecha.getDate():(s.fecha.getDate()%5===0?s.fecha.getDate():'')}</div>
      </div>`;}).join('')}
  </div>`;
}

function pintarRanking(cont,d){
  const top=d.productos.slice(0,10);
  if(!top.length){cont.innerHTML='<div class="empty">Sin productos vendidos</div>';return;}
  const max=top[0].importe||1;
  cont.innerHTML=`<div class="rank">
    ${top.map((p,ix)=>`<div class="rank-fila">
      <span class="rank-n">${ix+1}</span>
      <div class="rank-cuerpo">
        <div class="rank-top"><span class="rank-nom">${esc(p.nombre)}</span><b class="num">${$m(p.importe)}</b></div>
        <div class="rank-barra"><div style="width:${(p.importe/max)*100}%"></div></div>
      </div>
    </div>`).join('')}
  </div>
  <div class="nota-dash" style="margin-top:16px"><b>${esc(top[0].nombre)}</b> es tu producto estrella: se llevó el <b>${d.total>0?(top[0].importe/d.total*100).toFixed(0):0}%</b> de lo facturado. Un quiebre de stock ahí es venta perdida directa.</div>`;
}

function pintarRubros(cont,d){
  const top=d.rubros.slice(0,5);
  const resto=d.rubros.slice(5).reduce((a,r)=>a+r.importe,0);
  const items=[...top.map((r,i)=>({...r,color:COLORES_RUBRO[i]})),
               ...(resto>0.009?[{nombre:'Resto',importe:resto,color:'#98A2B3'}]:[])];
  if(!items.length){cont.innerHTML='<div class="empty">Sin datos</div>';return;}
  let acum=0;
  const grad=items.map(it=>{
    const desde=(acum/d.total)*100; acum+=it.importe;
    const hasta=(acum/d.total)*100;
    return `${it.color} ${desde}% ${hasta}%`;
  }).join(',');
  cont.innerHTML=`<div class="rubros-box">
    <div class="dona" style="background:conic-gradient(${grad})">
      <div class="dona-centro"><b class="num">${$m(d.total)}</b><span>total</span></div>
    </div>
    <div class="leyenda" style="flex:1">
      ${items.map(it=>`<div class="leyenda-item">
        <span class="punto" style="background:${it.color}"></span>
        <span>${esc(it.nombre)}</span><b class="num">${$m(it.importe)}</b>
        <span class="pct">${d.total>0?Math.round(it.importe/d.total*100):0}%</span>
      </div>`).join('')}
    </div>
  </div>
  <div class="nota-dash" style="margin-top:16px"><b>${esc(items[0].nombre)}</b> es el rubro que más aporta: <b>${d.total>0?Math.round(items[0].importe/d.total*100):0}%</b> de lo facturado del período.</div>`;
}

function exportarProductos(d){
  const filas=[['Producto','Rubro','Cantidad','Facturado']];
  d.productos.forEach(p=>{
    const pr=p.pid?prod(p.pid):null;
    filas.push([p.nombre,(pr&&pr.rubro)||p.rubro||'',p.cant,p.importe.toFixed(2)]);
  });
  const csv=filas.map(f=>f.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`productos-vendidos-${d.ini.slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  aviso('Detalle descargado','ok');
}

(async function inicio(){
  if(sb){
    $('#formLogin').addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=$('#btnLogin'); btn.disabled=true; btn.textContent='Entrando…';
      let r;
      try{ r=await iniciarSesion($('#loginEmail').value.trim(),$('#loginPass').value); }
      catch(err){ console.error(err); r={ok:false,msg:'Error inesperado: '+(err.message||err)}; }
      btn.disabled=false; btn.textContent='Ingresar';
      if(r.ok) await mostrarApp();
      else mostrarLogin({texto:r.msg,tipo:r.tipo||'bad'});
    });
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      sesion=session;
      const {data:lic}=await sb.from('clientes_licencia').select('activo').eq('id',session.user.id).single();
      if(lic&&lic.activo!==false) await mostrarApp();
      else { await sb.auth.signOut(); sesion=null; mostrarLogin({texto:'Tu cuenta no está activa. Contactá a quien te vendió el sistema para activarla.',tipo:'warn'}); }
    } else {
      mostrarLogin();
    }
    return;
  }
  // sin Supabase configurado: modo local, sin login
  $('#appWrap').hidden=false;
  await cargar();
  render();
  const u=db.config.ultBackup;
  if(!u||(Date.now()-new Date(u).getTime())>20*3600*1000){
    if(db.productos.length){ await backupAuto(); }
  }
  if(SUPABASE_URL.startsWith('PEGA_TU')||SUPABASE_ANON_KEY.startsWith('PEGA_TU')){
    aviso('Faltan pegar las claves de Supabase en este archivo — está corriendo en modo local, sin login','bad');
  } else if(typeof supabase==='undefined'){
    aviso('No se pudo cargar la librería de Supabase — revisá tu conexión a internet','bad');
  } else if(!tieneStorage){
    aviso('Este visor no guarda datos solo: usá Respaldo → Descargar copia','bad');
  }
})();
