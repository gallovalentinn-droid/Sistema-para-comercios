<style>
:root{
  --ink:#12161D; --ink-2:#1E2530; --ink-3:#2B3341;
  --bg:#F2F4F7; --paper:#FFFFFF; --line:#E2E6EC; --line-2:#C7CEDA;
  --txt:#161B24; --muted:#68717F;
  --primary:#1857D6; --primary-d:#1041A8; --primary-l:#E9F0FE;
  --verde:#0E7A54; --verde-d:#0A5C3F; --verde-l:#E4F3EC;
  --rojo:#CC3B22; --rojo-d:#A32C18; --rojo-l:#FCEAE6;
  --ambar:#B4790B; --ambar-l:#FBF0D9;
  --azul:var(--primary); --azul-l:var(--primary-l);
  --r:12px; --gap:8px;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block;pointer-events:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh;transition:grid-template-columns .16s ease}
.app.colapsado{grid-template-columns:68px 1fr}
.rail{background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid #262E3B;display:flex;align-items:center;gap:10px}
.brand .mk{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;cursor:pointer}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;font-weight:700;line-height:1.25}
.brand span{display:block;font-size:12px;color:#8A93A3;margin-top:1px}
.brand-txt{min-width:0;overflow:hidden;white-space:nowrap;flex:1}
.toggleRail{margin-left:auto;background:none;border:0;color:#7C8698;cursor:pointer;padding:6px;border-radius:8px;flex:none;display:flex}
.toggleRail:hover{background:#1D2431;color:#fff}
.toggleRail svg{width:16px;height:16px}
.nav{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto;overflow-x:hidden}
.nav button{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;color:#AEB7C4;padding:13px 14px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;font-size:15px;position:relative;min-height:48px;white-space:nowrap}
.nav button:hover{background:#1D2431;color:#fff}
.nav button.on{background:var(--primary);color:#fff;font-weight:600}
.nav .nav-sep{height:1px;background:#262E3B;margin:10px 6px}
.nav .nav-grupo{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5B6577;font-weight:600;padding:14px 14px 5px}
.nav .nav-grupo:first-child{padding-top:4px}
.nav button.sec{padding:9px 14px;min-height:38px;font-size:13.5px;color:#8891A1;font-weight:500}
.nav button.sec svg.i{width:16px;height:16px}
.nav button.sec:hover{background:#1D2431;color:#D6DBE3}
.nav button.sec.on{background:#252D3A;color:#fff}
.nav .ic{width:20px;text-align:center;flex:none;display:flex}
.nav .tag{margin-left:auto;font-size:12px;font-weight:700;background:var(--rojo);color:#fff;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:flex;align-items:center;justify-content:center}
.rail-foot{padding:14px 18px;border-top:1px solid #262E3B;font-size:12px;color:#7C8698;line-height:1.6}
.rail-foot .estado{display:flex;align-items:center;gap:6px;margin-top:4px}
.rail-foot .dot{width:7px;height:7px;border-radius:99px;background:var(--verde);flex:none}
.rail-foot .modo-caja{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #262E3B}
/* barra colapsada: solo íconos, con el nombre como tooltip nativo */
.app.colapsado .brand{padding:22px 0 18px;justify-content:center}
.app.colapsado .brand-txt,.app.colapsado .toggleRail{display:none}
.app.colapsado .nav{padding:12px 10px}
.app.colapsado .nav button{justify-content:center;padding:13px 0;gap:0}
.app.colapsado .nav button span:not(.ic):not(.tag){display:none}
.app.colapsado .nav .tag{position:absolute;top:6px;right:6px;margin:0;min-width:16px;height:16px;font-size:10px}
.app.colapsado .nav .nav-grupo{display:none}
.app.colapsado .rail-foot{padding:14px 10px;text-align:center}
.app.colapsado .rail-foot .modo-caja,.app.colapsado .rail-foot>*:not(.estado){display:none}
.app.colapsado .rail-foot .estado span:not(.dot){display:none}
.app.colapsado .rail-foot .estado{justify-content:center;margin-top:0}
.main{padding:28px 32px 70px;max-width:1500px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--muted);font-size:14.5px;margin-top:5px;line-height:1.5;max-width:52ch}

/* ---------- piezas ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.card-b{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:1px solid var(--primary);padding:11px 18px;border-radius:9px;cursor:pointer;font-weight:600;font-size:15px;letter-spacing:-.005em;transition:transform .06s,background .15s;min-height:44px}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--paper);color:var(--txt);border-color:var(--line-2)}
.btn.ghost:hover{background:#F1F4F8;border-color:#AEB8C6}
.btn.text{background:none;border-color:transparent;color:var(--muted);padding:8px 10px;font-weight:600}
.btn.text:hover{background:#EEF1F5;color:var(--txt)}
.btn.verde{background:var(--verde);border-color:var(--verde)}
.btn.verde:hover{background:var(--verde-d);border-color:var(--verde-d)}
.btn.rojo{background:var(--rojo);border-color:var(--rojo)}
.btn.rojo:hover{background:var(--rojo-d);border-color:var(--rojo-d)}
.btn.rojo.text{background:none;color:var(--rojo);border-color:transparent}
.btn.rojo.text:hover{background:var(--rojo-l)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:8px;min-height:38px}
.btn.sm svg.i,.btn.text svg.i{width:15px;height:15px}
.btn.big{padding:16px 18px;font-size:17px;width:100%;min-height:54px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{background:var(--paper);border:1.5px solid var(--line-2);border-radius:9px;padding:11px 12px;width:100%;min-height:44px}
.inp:hover{border-color:#9FAAB9}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #EEF1F5;vertical-align:middle;font-size:15px}
tbody tr:hover{background:#F7F9FB}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--verde-l);color:var(--verde-d)}
.pill.warn{background:var(--ambar-l);color:var(--ambar)}
.pill.bad{background:var(--rojo-l);color:var(--rojo)}
.pill.info{background:var(--primary-l);color:var(--primary-d)}
.pill.mute{background:#EFF2F6;color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:7px;font-weight:700}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.kpi span{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:7px}
.kpi small{color:var(--muted);font-size:12.5px}

/* tablas -> tarjetas en pantallas chicas, para que sean legibles en el celular */
@media (max-width:760px){
  table.mtable thead{display:none}
  table.mtable, table.mtable tbody, table.mtable tr{display:block;width:100%}
  table.mtable tr{background:var(--paper);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;padding:4px 14px}
  table.mtable td{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #F1F3F6;padding:10px 0;text-align:right}
  table.mtable tr:hover{background:var(--paper)}
  table.mtable td:last-child{border-bottom:0}
  table.mtable td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:left}
  table.mtable td[data-label=""]::before,table.mtable td:not([data-label])::before{content:none}
  table.mtable td[colspan]{display:block;text-align:left}
  table.mtable td[colspan]::before{content:none}
}

/* ---------- mostrador (POS) ---------- */
.pos{display:grid;grid-template-columns:1fr 372px;gap:22px;align-items:start}
.scan{display:flex;align-items:center;gap:13px;background:var(--ink);border-radius:var(--r);padding:15px 16px;border:2px solid var(--ink)}
.scan:focus-within{border-color:var(--primary)}
.scan .ic{color:#8B95A5}
.scan input{flex:1;background:transparent;border:0;color:#fff;font-size:19px;padding:6px 0;font-weight:500}
.scan input::placeholder{color:#5D6879;font-weight:400}
.scan input:focus{outline:none}
.scan-hint{color:var(--muted);font-size:13px;margin-top:9px;padding:0 2px}
.results{position:relative}
.results ul{position:absolute;z-index:30;left:0;right:0;top:8px;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;box-shadow:0 14px 34px rgba(15,22,32,.16)}
.results li{padding:11px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.results li:hover,.results li.sel{background:var(--primary-l)}
.results .nm{font-weight:600}
.results .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
.results .thumb{width:34px;height:34px;border-radius:7px;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;font-weight:700;color:var(--muted)}
.results .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line-2);border-radius:8px;overflow:hidden;width:fit-content}
.qty button{background:#F4F6F9;border:0;width:36px;height:38px;cursor:pointer;font-weight:700;font-size:16px;color:var(--muted)}
.qty button:hover{background:#E7EBF1;color:var(--txt)}
.qty input{width:60px;height:38px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:var(--mono);font-size:14px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:38px}
.x:hover{background:var(--rojo-l);color:var(--rojo)}

/* el ticket: pieza central de la identidad */
.tik-wrap{position:sticky;top:28px}
.tik{background:var(--paper);padding:22px 20px 28px;position:relative;filter:drop-shadow(0 10px 22px rgba(15,22,32,.13));border-radius:3px 3px 0 0}
.tik::after{content:'';position:absolute;left:0;right:0;bottom:-11px;height:11px;
  background:linear-gradient(45deg,transparent 33.4%,var(--paper) 33.4%,var(--paper) 66.6%,transparent 66.6%),
             linear-gradient(-45deg,transparent 33.4%,var(--paper) 33.4%,var(--paper) 66.6%,transparent 66.6%);
  background-size:14px 22px}
.tik-top{text-align:center;font-size:12px;color:var(--muted);padding-bottom:13px;border-bottom:1.5px dashed var(--line-2)}
.tik-top b{display:block;font-size:15.5px;color:var(--txt);letter-spacing:-.01em;margin-bottom:4px;font-weight:700}
.tik-items{list-style:none;margin:0;padding:13px 0;max-height:34vh;overflow:auto}
.tik-items li{margin-bottom:12px}
.tik-l1{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;font-weight:600;line-height:1.3}
.tik-l1 .dots{flex:1;border-bottom:1.5px dotted var(--line-2);margin:0 2px 4px;min-width:14px}
.tik-l2{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.tik-l2 .um{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tik-dto{border-top:1.5px dashed var(--line-2);padding-top:12px;margin-bottom:2px}
.tik-fila-dto{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:5px}
.tik-fila-dto b{font-size:13.5px;font-weight:600}
.tik-fila-dto.dto{color:var(--verde-d)}
.tik-fila-dto.dto b{color:var(--verde-d)}
.dto-box{margin-bottom:14px}
.dto-box.activo{background:var(--verde-l);border-radius:10px;padding:12px 14px}
.dto-resumen{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dto-tit{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--verde-d);font-weight:700}
.dto-resumen b{font-family:var(--mono);font-size:19px;color:var(--verde-d);display:block;margin:2px 0}
.dto-det{font-size:12px;color:var(--verde-d);opacity:.85}
.tik-tot{border-top:1.5px dashed var(--line-2);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.tik-tot span{font-size:13.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.tik-tot b{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.03em;color:var(--primary-d)}
.tik-empty{padding:36px 6px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.cobro{margin-top:20px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:#EFF2F6;border-radius:10px;padding:4px;margin-bottom:15px}
.seg button{flex:1 1 auto;min-width:84px;background:none;border:0;padding:11px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;min-height:42px}
.seg button.on{background:var(--paper);color:var(--txt);box-shadow:0 1px 3px rgba(15,22,32,.14)}
.vuelto{display:flex;justify-content:space-between;align-items:baseline;padding:13px 14px;border-radius:9px;background:var(--verde-l);margin:13px 0}
.vuelto span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--verde-d)}
.vuelto b{font-family:var(--mono);font-size:24px;color:var(--verde-d)}
.vuelto.falta{background:var(--rojo-l)}
.vuelto.falta span,.vuelto.falta b{color:var(--rojo)}
@keyframes tear{to{transform:translateY(26px) rotate(1.4deg);opacity:0}}
@keyframes roll{from{transform:translateY(-22px);opacity:0}}
.tik.tear{animation:tear .42s cubic-bezier(.5,0,.75,0) forwards}
.tik.roll{animation:roll .3s ease-out}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(11,15,21,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.mod{background:var(--paper);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(11,15,21,.35)}
.mod.wide{max-width:820px}
.mod-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}
.mod-h h3{margin:0;font-size:18px;letter-spacing:-.015em;font-weight:700}
.mod-b{padding:22px;max-height:66vh;overflow:auto}
.mod-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:10px;background:#F8FAFC;border-radius:0 0 16px 16px;flex-wrap:wrap}

/* ---------- avisos ---------- */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:0 10px 26px rgba(11,15,21,.3);animation:up .22s ease-out;display:flex;align-items:center;gap:9px}
.toast.bad{background:var(--rojo)}
.toast.ok{background:var(--verde)}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* ---------- impresión 58mm ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  .app,.toasts,.ov{display:none !important}
  #print{display:block;width:54mm;margin:0;font-family:var(--mono);font-size:10.5px;color:#000;line-height:1.45}
  #print .c{text-align:center}
  #print .b{font-weight:600}
  #print hr{border:0;border-top:1px dashed #000;margin:5px 0}
  #print table{width:100%}
  #print td{padding:1px 0;border:0;font-size:10.5px}
  #print .r{text-align:right}
  @page{size:58mm auto;margin:3mm}
}
@media (max-width:1080px){ .pos{grid-template-columns:1fr} .tik-wrap{position:static} }
@media (max-width:820px){
  .app,.app.colapsado{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:60;flex-direction:row;box-shadow:0 -6px 18px rgba(11,15,21,.15)}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;padding:6px;gap:2px}
  .app.colapsado .nav{padding:6px}
  .nav button,.app.colapsado .nav button{flex-direction:column;gap:4px;font-size:11px;padding:8px 2px;justify-content:center;min-height:56px;border-radius:10px}
  .nav .tag{position:absolute;margin:0;top:2px;right:14%}
  .app.colapsado .nav button span:not(.ic){display:block}
  .nav .nav-grupo{display:none}
  .main{padding:18px 14px 100px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- dashboards del resumen ---------- */
.barra-apilada{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#EFF2F6;margin-bottom:18px}
.barra-apilada>div{height:100%}
.leyenda{display:flex;flex-direction:column;gap:11px}
.leyenda-item{display:flex;align-items:center;gap:10px;font-size:14.5px}
.leyenda-item .punto{width:10px;height:10px;border-radius:99px;flex:none}
.leyenda-item b{margin-left:auto;font-weight:600}
.leyenda-item .pct{color:var(--muted);font-size:13px;min-width:38px;text-align:right;font-family:var(--mono)}
.nota-dash{background:var(--primary-l);color:var(--ink-2);padding:13px 15px;border-radius:10px;font-size:14px;line-height:1.6}
.kpi small.formula,.formula{display:block;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:5px}
.formula .num{color:var(--txt);font-weight:600}
.margen-box{background:#F7F9FB;border:1px solid var(--line);border-radius:11px;padding:15px 16px}
.margen-box .margen-tit{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.margen-box>b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:6px;color:var(--verde-d)}
.margen-pct{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.graf-horas{display:flex;align-items:flex-end;gap:2px;height:150px}
.hora-col{flex:1;display:flex;align-items:flex-end;min-width:0}
.hora-barra{width:100%;border-radius:3px 3px 0 0}
.graf-ejes{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.rank{display:flex;flex-direction:column;gap:15px}
.rank-fila{display:flex;align-items:flex-start;gap:13px}
.rank-n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:600;min-width:16px;padding-top:2px}
.rank-cuerpo{flex:1;min-width:0}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.rank-nom{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-barra{height:7px;background:#EFF2F6;border-radius:99px;overflow:hidden}
.rank-barra>div{height:100%;background:var(--verde);border-radius:99px}
.rubros-box{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.dona{width:170px;height:170px;border-radius:99px;position:relative;flex:none}
.dona-centro{position:absolute;inset:30px;background:var(--paper);border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dona-centro b{font-size:17px;letter-spacing:-.02em}
.dona-centro span{font-size:11.5px;color:var(--muted)}
@media (max-width:620px){ .rubros-box{gap:20px;justify-content:center} .dona{width:140px;height:140px} .dona-centro{inset:26px} }

/* ---------- comercios de ejemplo ---------- */
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.demo-card{text-align:left;background:var(--paper);border:1.5px solid var(--line-2);border-radius:12px;
  padding:16px 17px;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-family:inherit;transition:border-color .14s,background .14s}
.demo-card:hover{border-color:var(--primary);background:var(--primary-l)}
.demo-card b{font-size:16px;letter-spacing:-.015em}
.demo-card span{font-size:13.5px;color:var(--muted);line-height:1.45}

.demo-card em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- configuración ---------- */
/* navegación interna de Configuración: ancla a cada bloque */
.config-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.config-nav button{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);
  padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.config-nav button:hover{border-color:var(--primary);color:var(--primary-d)}
.config-card{max-width:680px;scroll-margin-top:20px}
.fila-config{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.fila-config:last-child{border-bottom:0}
.fila-config b{font-size:15px}
.sub-config{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;max-width:42ch;line-height:1.4}

/* ---------- acceso ---------- */
.franja-off{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--ambar);color:#fff;
  padding:8px 16px;text-align:center;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px}
.franja-off .pulso{width:8px;height:8px;border-radius:99px;background:#fff;animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{opacity:.35}}
body.offline .app{padding-top:34px}
@media(max-width:820px){ body.offline .main{padding-top:44px} }
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-box{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 18px 44px rgba(15,22,32,.1)}
.login-box .mk{width:44px;height:44px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;margin-bottom:16px}

.login-msg{margin-top:14px;font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:9px}
.login-msg.bad{background:var(--rojo-l);color:var(--rojo)}
.login-msg.warn{background:var(--ambar-l);color:var(--ambar)}

<script>
/* ═══════════════════════════════════════════════════════
   1. ESTADO Y PERSISTENCIA
   ═══════════════════════════════════════════════════════ */
const KEY='kiosco:db', BKP='kiosco:backup-auto';

// ── Configuración de Supabase ──
// Pegá acá tu Project URL y tu anon public key (Project Settings → API en Supabase).
// Mientras diga "PEGA_TU..." el sistema funciona en modo local, sin login, como antes.
const SUPABASE_URL = 'https://zzpmdiivewmvhiszmdzh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6cG1kaWl2ZXdtdmhpc3ptZHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjA3ODUsImV4cCI6MjEwMjMzNjc4NX0.bGYuqksSOYu6cxk9yx4ojafUcKzER4JNZSXS_4sA8rU';
const sb = (typeof supabase!=='undefined' && SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const VACIA=()=>({
  productos:[], clientes:[], ventas:[], movs:[], pagos:[], cierres:[], combos:[], egresos:[], ajustesFiado:[], promociones:[],
  config:{nombre:'Mi comercio', nroVenta:1, fondoCaja:0, fondoCajaCigarros:0, ultBackup:null, whatsappDueno:'', pinDuenio:'', motivosEgresoExtra:[], diasAvisoVence:7,
    moduloFiado:true, moduloVencimientos:true, permisosEmpleado:{}}
});
let db=VACIA();
let vista='vender';
let mem={};                                   // respaldo si no hay storage ni Supabase
let sesion=null;                               // sesión de Supabase, si está configurado
const tieneStorage = typeof window.storage!=='undefined' && window.storage;

/* ═══ MODO SIN CONEXIÓN ═══
   Todo se guarda primero en el dispositivo (instantáneo, ande o no internet).
   Si hay sesión y conexión, además se sube a la nube. Si no, queda pendiente
   y se sincroniza solo apenas vuelve la señal. */
let enLinea = navigator.onLine!==false;
let pendienteSubir = false;       // hay cambios locales sin subir
let sincronizando = false;
let ultimaSync = null;

const LKEY = ()=> 'kiosco:local:' + (sesion? sesion.user.id : 'anon');
const LPEND = ()=> LKEY() + ':pendiente';

function guardarLocal(){
  try{
    localStorage.setItem(LKEY(), JSON.stringify({db,fecha:new Date().toISOString()}));
    localStorage.setItem(LPEND(), pendienteSubir?'1':'0');
    return true;
  }catch(e){ console.error('No se pudo guardar local',e); return false; }
}
function leerLocal(){
  try{
    const raw=localStorage.getItem(LKEY());
    if(!raw) return null;
    const o=JSON.parse(raw);
    return o&&o.db ? o : null;
  }catch(e){ return null; }
}

async function sGet(k){
  if(!tieneStorage) return mem[k]??null;
  try{ const r=await window.storage.get(k); return r? r.value : null; }catch(e){ return null; }
}
async function sSet(k,v){
  if(!tieneStorage){ mem[k]=v; return true; }
  try{ await window.storage.set(k,v); return true; }catch(e){ console.error(e); return false; }
}

let tGuardar=null, guardando=false;
function guardar(){
  // 1) local siempre y de inmediato: si se corta la luz, no se pierde la venta
  pendienteSubir = !!(sb&&sesion);
  guardarLocal();
  if(!tieneStorage&&!sb) mem[KEY]=JSON.stringify(db);
  pintarFoot();
  // 2) la nube, con un respiro para no mandar un pedido por tecla
  clearTimeout(tGuardar);
  tGuardar=setTimeout(()=>{ subirALaNube(); },600);
}
async function subirALaNube(){
  if(!(sb&&sesion)){ await sSet(KEY, JSON.stringify(db)); pendienteSubir=false; guardarLocal(); pintarFoot(); return true; }
  if(!enLinea||sincronizando) return false;
  sincronizando=true; guardando=true; pintarFoot();
  let ok=false;
  try{
    const {error}=await sb.from('datos_kiosco').update({db,actualizado_en:new Date().toISOString()}).eq('id',sesion.user.id);
    if(error) throw error;
    ok=true; pendienteSubir=false; ultimaSync=new Date().toISOString();
    guardarLocal();
  }catch(e){
    console.error('Sin subir a la nube:',e);
    enLinea=false;                    // el navegador puede decir "online" y no llegar igual
    pendienteSubir=true; guardarLocal();
  }finally{
    sincronizando=false; guardando=false; pintarFoot();
  }
  return ok;
}
async function cargar(){
  const local=leerLocal();
  const hayPendiente = localStorage.getItem(LPEND())==='1';

  if(sb&&sesion&&enLinea&&!hayPendiente){
    // caso normal: la nube manda
    try{
      const {data,error}=await sb.from('datos_kiosco').select('db').eq('id',sesion.user.id).single();
      if(error) throw error;
      if(data&&data.db&&Object.keys(data.db).length){
        db={...VACIA(),...data.db,config:{...VACIA().config,...(data.db.config||{})}};
      } else {
        await sb.from('datos_kiosco').insert({id:sesion.user.id,db});
      }
      ultimaSync=new Date().toISOString();
      pendienteSubir=false; guardarLocal();
      return;
    }catch(e){
      console.error(e);
      enLinea=false;                  // no llegamos: seguimos con lo local
    }
  }

  if(local){
    db={...VACIA(),...local.db,config:{...VACIA().config,...(local.db.config||{})}};
    pendienteSubir=hayPendiente;
    if(hayPendiente&&enLinea) setTimeout(subirALaNube,1200);   // arrastrábamos cambios: los subimos
    else if(!enLinea) aviso('Estás sin conexión — podés seguir vendiendo, se sincroniza al volver','bad');
    return;
  }

  // sin nube ni local: modo archivo suelto de siempre
  const raw=await sGet(KEY);
  if(raw){ try{ const d=JSON.parse(raw); db={...VACIA(),...d, config:{...VACIA().config,...(d.config||{})}}; }catch(e){ aviso('No se pudo leer la base guardada','bad'); } }
}

/* ── el navegador nos avisa cuando vuelve la señal ── */
window.addEventListener('online',()=>{
  enLinea=true; pintarFoot();
  if(pendienteSubir){
    aviso('Volvió la conexión — sincronizando…','ok');
    subirALaNube().then(ok=>{ if(ok) aviso('Todo sincronizado','ok'); });
  } else aviso('Volvió la conexión','ok');

/* ── acceso: login contra Supabase y chequeo de licencia activa ── */
async function iniciarSesion(email,pass){
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) return {ok:false,msg: error.message==='Invalid login credentials' ? 'Mail o contraseña incorrectos.' : error.message};
    const {data:lic,error:errLic}=await sb.from('clientes_licencia').select('activo').eq('id',data.user.id).single();
    if(errLic) return {ok:false,msg:'No se pudo verificar la licencia: '+errLic.message};
    if(!lic||lic.activo===false){
      await sb.auth.signOut();
      return {ok:false,msg:'Tu cuenta no está activa. Contactá a quien te vendió el sistema para activarla.',tipo:'warn'};
    }
    sesion=data.session;
    return {ok:true};
  }catch(e){
    console.error(e);
    return {ok:false,msg:'No se pudo conectar con el servidor. Revisá la URL de Supabase en el archivo, y tu conexión a internet. ('+(e.message||e)+')'};
  }
}
function cerrarSesion(){
  if(sb) sb.auth.signOut();
  sesion=null; db=VACIA();
  mostrarLogin();
}
function mostrarLogin(msg){
  $('#appWrap').hidden=true;
  $('#loginWrap').hidden=false;
  const cont=$('#loginMsg');
  cont.innerHTML = msg ? `<div class="login-msg ${msg.tipo||'bad'}">${esc(msg.texto)}</div>` : '';
  $('#loginPass').value='';
  setTimeout(()=>$('#loginEmail').focus(),50);
}
async function mostrarApp(){
  $('#loginWrap').hidden=true;
  $('#appWrap').hidden=false;
  $('#btnColapsar').onclick=toggleColapso;
  $('#brandMk').onclick=()=>{ if(railColapsado) toggleColapso(); };
  await cargar();
  render();
  const u=db.config.ultBackup;
  if(!u||(Date.now()-new Date(u).getTime())>20*3600*1000){ if(db.productos.length){ await backupAuto(); } }
  if(db.config.moduloVencimientos!==false){
    const vencidos=db.productos.filter(estaVencido).length;
    if(vencidos) aviso(`${vencidos} producto${vencidos===1?'' :'s'} con stock ya vencido — revisá Vencimientos`,'bad');
  }
}

/* ── vencimientos ──
   Guardamos una fecha por producto: la del lote que vence primero.
   Al ingresar mercadería nueva se puede actualizar. */
const DIAS_AVISO=()=>Math.max(1,Number(db.config.diasAvisoVence)||7);
function diasParaVencer(p){
  if(!p||!p.vence) return null;
  const v=new Date(p.vence+'T00:00:00');
  if(isNaN(v)) return null;
  const hoyD=new Date(); hoyD.setHours(0,0,0,0);
  return Math.round((v-hoyD)/86400000);
}
const estaVencido=p=>{ const d=diasParaVencer(p); return d!==null&&d<0; };
const porVencer=p=>{ const d=diasParaVencer(p); return d!==null&&d>=0&&d<=DIAS_AVISO(); };
// solo alertamos si todavía queda stock: lo vencido sin stock no molesta
const alertaVence=p=>Number(p.stock)>0&&(estaVencido(p)||porVencer(p));
const productosVencimiento=()=>db.productos.filter(alertaVence)
  .sort((a,b)=>(diasParaVencer(a)-diasParaVencer(b)));
function textoVence(p){
  const d=diasParaVencer(p);
  if(d===null) return '';
  if(d<0) return d===-1?'venció ayer':`venció hace ${Math.abs(d)} días`;
  if(d===0) return 'vence hoy';
  if(d===1) return 'vence mañana';
  return `vence en ${d} días`;
}

function variacion(anterior,nuevo){
  anterior=Number(anterior); nuevo=Number(nuevo);
  if(!anterior||anterior<=0) return null;
  const dif=nuevo-anterior, pct=dif/anterior*100;
  return {dif,pct,subio:dif>0};
}
function pillVariacion(anterior,nuevo){
  const v=variacion(anterior,nuevo);
  if(!v||Math.abs(v.pct)<0.05) return `<span class="pill mute">Sin cambio</span>`;
  return `<span class="pill ${v.subio?'warn':'ok'}">${v.subio?'▲':'▼'} ${v.subio?'+':''}${v.pct.toFixed(1)}%</span>`;
}

function moduloActivo(id){

  return true;

  if(v.id==='config') return esD;                                   // siempre solo el dueño
  if(!moduloActivo(v.id)) return false;                             // apagado del todo: nadie lo ve
  if(esD) return true;                                              // el dueño ve todo lo que esté prendido
  if(v.id==='vender'||v.id==='soporte') return true;                // siempre disponibles para el empleado

function cambiarRol(){
  if(esDuenio()){
    // pasar a empleado no pide nada: es bajar de permisos
    rol='empleado';
    if(!vistasVisibles().some(v=>v.id===vista)) vista='vender';

    aviso('Modo empleado activado — el resumen y la configuración quedan ocultos','ok');
    return;
  }
  // volver a dueño pide el PIN, si hay uno configurado
  if(!db.config.pinDuenio){
    rol='duenio'; render();
    aviso('Modo dueño activado. Poné un PIN en Respaldo para protegerlo','ok');
    return;
  }
  modal({titulo:'Volver al modo dueño',

    alAbrir:ov=>{

      $('#okPin',ov).onclick=probar;
    }});
}
function ir(v){
  const def=VISTAS.find(x=>x.id===v);
  if(def&&!vistaVisible(def,esDuenio())){ aviso('No tenés acceso a esa sección','bad'); return; }
  vista=v; render();
}
function render(){
  if(!vistasVisibles().some(v=>v.id===vista)) vista='vender';
  pintarNav(); pintarFoot();
  const m=$('#main');
  ({vender:vVender,resumen:vResumen,productos:vProductos,combos:vCombos,promociones:vPromociones,reponer:vReponer,
    vencimientos:vVencimientos,fiado:vFiado,caja:vCaja,config:vConfig,soporte:vSoporte}[vista])(m);
  window.scrollTo(0,0);
}

/* ═══════════════════════════════════════════════════════
   4. MOSTRADOR — PUNTO DE VENTA
   ═══════════════════════════════════════════════════════ */
let ticket=[];                 // {id, tipo:'producto'|'combo', prodId?, comboId?, nombre, precio, cant, componentes?}
let pago='efectivo', clienteFiado='', recibido='';
let pagoMixto=[];              // [{forma,monto}] cuando pago==='mixto'

// miniatura del producto para las listas de selección: foto si tiene, si no un placeholder con la inicial
function miniFoto(p){
  if(p.foto) return `<span class="thumb"><img src="${esc(p.foto)}" alt=""></span>`;
  return `<span class="thumb">${esc((p.nombre||'?').trim().charAt(0).toUpperCase())}</span>`;
}
function buscarProductos(q,lim=8){
  q=q.trim().toLowerCase(); if(!q) return [];
  return db.productos.filter(p=>
    (p.nombre||'').toLowerCase().includes(q)||
    (p.ean||'').toLowerCase().includes(q)||
    (p.rubro||'').toLowerCase().includes(q)
  ).slice(0,lim);
}
function buscarCombos(q,lim=5){
  q=q.trim().toLowerCase(); if(!q) return [];
  return (db.combos||[]).filter(c=>c.activo!==false&&(c.nombre||'').toLowerCase().includes(q)).slice(0,lim);
}
function agregarAlTicket(p,cant=1){
  const l=ticket.find(i=>i.id===p.id);
  if(l) l.cant+=cant; else ticket.push({id:p.id,tipo:'producto',prodId:p.id,nombre:p.nombre,precio:Number(p.precio)||0,cant});
  const total=ticket.find(i=>i.id===p.id).cant;
  if(total>Number(p.stock)) aviso(`Ojo: quedan ${fmtCant(p,p.stock)} de ${p.nombre}`,'bad');
  pintarPOS();
}
function comboStockDisponible(combo){
  return Math.min(...combo.items.map(it=>{const p=prod(it.prodId); return p? Math.floor(Number(p.stock)/it.cant) : 0;}));
}
function agregarComboAlTicket(combo,cant=1){
  const id='combo:'+combo.id;
  const l=ticket.find(i=>i.id===id);
  if(l) l.cant+=cant;
  else ticket.push({id,tipo:'combo',comboId:combo.id,nombre:combo.nombre,precio:Number(combo.precio)||0,cant,
    componentes:combo.items.map(it=>{const p=prod(it.prodId); return {prodId:it.prodId,nombre:p?p.nombre:'(producto eliminado)',cant:it.cant,precio:p?Number(p.precio):0,costo:p?Number(p.costo):0,rubro:p?p.rubro:''};})});
  const linea=ticket.find(i=>i.id===id);
  const disponible=comboStockDisponible(combo);
  if(linea.cant>disponible) aviso(`Ojo: con el stock actual solo podés armar ${disponible} combos de "${combo.nombre}"`,'bad');
  pintarPOS();
}
function seleccionarProducto(p){
  if(!p) return;
  if(p.unidad==='kg'){ pedirPeso(p); return; }
  // si es un suelto y no queda ninguno, ofrecemos abrir un atado en el mismo paso
  if(esSuelto(p)){
    const yaEnTicket=(ticket.find(i=>i.id===p.id)||{}).cant||0;
    if(Number(p.stock)-yaEnTicket<=0){
      const a=atadoDe(p);
      if(a&&Number(a.stock)>0){ ofrecerAbrirAtado(p,a); return; }
      if(a){ aviso(`No quedan sueltos ni atados de ${a.nombre}`,'bad'); }
    }
  }
  agregarAlTicket(p,1);
}
function ofrecerAbrirAtado(s,a){
  const upa=porAtado(s);
  modal({titulo:'No quedan sueltos',
    cuerpo:`<p style="margin:0;line-height:1.7">Se terminaron los <b>${esc(s.nombre)}</b>, pero te quedan <b>${fmtCant(a,a.stock)}</b> de <b>${esc(a.nombre)}</b>.<br><br>¿Abrimos uno? Van a entrar <b>${upa} unidades</b> al stock de sueltos y sigo cargando la venta.</p>`,
    pie:`<button class="btn ghost" data-cerrar>No, cancelar</button><button class="btn verde" id="okAbrirYa">Abrir y vender</button>`,
    alAbrir:ov=>{
      $('#okAbrirYa',ov).focus();
      $('#okAbrirYa',ov).onclick=()=>{
        if(abrirAtados(s.id,1,true)){
          cerrarModal();
          agregarAlTicket(prod(s.id),1);
          aviso(`Atado abierto · +${upa} sueltos`,'ok');
          $('#scan')&&$('#scan').focus();
        }
      };
    }});
}
function pedirPeso(p){
  modal({titulo:'¿Cuánto pesa? — '+p.nombre,
    cuerpo:`
      <div class="kpi" style="margin-bottom:16px"><span>Precio por kilo</span><b>${$m(p.precio)}</b></div>
      <label class="f" for="pesoG">Gramos</label>
      <input id="pesoG" class="inp num" inputmode="decimal" placeholder="Ej: 250">
      <div class="row" style="margin-top:10px">
        ${[100,150,200,250,500,1000].map(g=>`<button type="button" class="btn ghost sm" data-g="${g}">${g<1000?g+' g':'1 kg'}</button>`).join('')}
      </div>
      <div id="pesoSub" style="margin-top:16px;color:var(--muted)"></div>`,
    pie:`<button class="btn ghost" data-cerrar>Cancelar</button><button class="btn verde" id="okPeso">Agregar al ticket</button>`,
    alAbrir:ov=>{
      const inp=$('#pesoG',ov);
      inp.focus();
      const actualizar=()=>{
        const kg=num(inp.value)/1000;
        $('#pesoSub',ov).innerHTML = kg>0 ? `Se agregan <b class="num">${nfKg.format(kg)} kg</b> · subtotal <b class="num">${$m(kg*p.precio)}</b>` : '';
      };
      inp.oninput=actualizar;
      $$('[data-g]',ov).forEach(b=>b.onclick=()=>{inp.value=b.dataset.g;actualizar();inp.focus();});
      const confirmarPeso=()=>{
        const kg=Math.round((num(inp.value)/1000)*1000)/1000;
        if(kg<=0){aviso('Ingresá un peso mayor a cero','bad');return;}
        agregarAlTicket(p,kg);
        cerrarModal();
        $('#scan')&&$('#scan').focus();
      };
      inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); confirmarPeso(); } };
      $('#okPeso',ov).onclick=confirmarPeso;
    }});
}
const subtotalTicket=()=>ticket.reduce((a,i)=>a+i.precio*i.cant,0);
/* descuento de la venta: por porcentaje o por monto fijo */
let dto={tipo:'porcentaje',valor:'',motivo:''};
function montoDescuento(){
  const sub=subtotalTicket(), v=num(dto.valor);
  if(!v||sub<=0) return 0;
  const m = dto.tipo==='porcentaje' ? sub*Math.min(100,v)/100 : Math.min(sub,v);
  return Math.round(m*100)/100;
}
const limpiarDescuento=()=>{ dto={tipo:'porcentaje',valor:'',motivo:''}; };

/* ── promociones: se aplican solas al vender ──
   Por producto y por categoría se descuentan del subtotal, línea por línea.
   Por medio de pago se descuenta del total una vez elegida la forma de pago. */
function vigentePromo(pr){
  if(pr.activa===false) return false;
  const h=hoy();
  if(pr.desde&&h<pr.desde) return false;
  if(pr.hasta&&h>pr.hasta) return false;
  return true;
}
// mejor % de promo para un producto: la promo puntual del producto gana por sobre la de su categoría
function promoParaProducto(p){
  if(!p) return 0;
  const activas=(db.promociones||[]).filter(vigentePromo);
  const porProd=activas.find(pr=>pr.tipo==='producto'&&pr.objetivoId===p.id);
  if(porProd) return num(porProd.porcentaje);
  const porCat=activas.filter(pr=>pr.tipo==='categoria'&&pr.objetivoId&&pr.objetivoId===p.rubro);
  return porCat.length ? Math.max(...porCat.map(pr=>num(pr.porcentaje))) : 0;
}
// detalle por línea de ticket (para mostrar el tag "Promo -X%"); no toca combos
function detallePromoAuto(){
  return ticket.filter(i=>i.tipo!=='combo').map(i=>{
    const p=prod(i.prodId); const pct=promoParaProducto(p);
    return pct>0 ? {itemId:i.id,pct,monto:Math.round(i.precio*i.cant*pct/100*100)/100} : null;
  }).filter(Boolean);
}
function descuentoPromoAuto(){
  return detallePromoAuto().reduce((a,d)=>a+d.monto,0);
}
// promo por medio de pago: solo tiene sentido con una forma única elegida, no en pago dividido
function promoPagoPct(forma){
  if(!forma||forma==='mixto'||forma==='fiado') return 0;
  const activas=(db.promociones||[]).filter(pr=>vigentePromo(pr)&&pr.tipo==='pago'&&pr.objetivoId===forma);
  return activas.length ? Math.max(...activas.map(pr=>num(pr.porcentaje))) : 0;
}
function descuentoPromoPago(){
  const pct=promoPagoPct(pago);
  if(!pct) return 0;
  const base=Math.max(0,subtotalTicket()-descuentoPromoAuto()-montoDescuento());
  return Math.round(base*pct/100*100)/100;
}
const totalTicket=()=>Math.max(0,Math.round((subtotalTicket()-descuentoPromoAuto()-montoDescuento()-descuentoPromoPago())*100)/100);

function vVender(m){
  m.innerHTML=`
  <div class="head">
    <div><h1>Vender</h1><div class="sub">Pasá el producto por el lector, o escribí su nombre para buscarlo.</div></div>
    <div class="row"><span class="pill mute num" id="posVentasHoy"></span></div>
  </div>
  <div class="pos">
    <div>
      <div class="scan"><span class="ic">${ic('scan')}</span>
        <input id="scan" placeholder="Escaneá el código o escribí el nombre del producto…" autocomplete="off" spellcheck="false">
      </div>
      <div class="scan-hint">Al elegir un producto o combo, se agrega solo al ticket de la derecha. Los que se venden por peso te van a preguntar cuánto pesa.</div>
      <div class="results"><ul id="res" hidden></ul></div>
      <div class="card" style="margin-top:16px"><div id="posTabla"></div></div>
    </div>
    <div class="tik-wrap">
      <div class="tik" id="tik"></div>
      <div class="cobro" id="cobro"></div>
    </div>
  </div>`;
  pintarPOS();
  const inp=$('#scan'); inp.focus();
  let sel=-1;
  const cerrarRes=()=>{ const el=$('#res'); if(el) el.hidden=true; sel=-1; };

  inp.addEventListener('input',()=>{
    const rc=buscarCombos(inp.value); const r=buscarProductos(inp.value); sel=-1;
    const ul=$('#res');
    if((!r.length&&!rc.length)||inp.value.trim().length<2){ ul.hidden=true; return; }
    ul.hidden=false;
    ul.innerHTML=
      rc.map(c=>`<li data-tipo="combo" data-id="${c.id}">
        <span><span class="nm">${esc(c.nombre)} <span class="pill info">Combo</span></span><br><span class="mt">${esc(c.items.map(it=>{const p=prod(it.prodId);return it.cant+'× '+(p?p.nombre:'?');}).join(' + '))}</span></span>
        <span class="num" style="font-weight:600">${$m(c.precio)}</span></li>`).join('')
      + r.map(p=>`<li data-tipo="producto" data-id="${p.id}">${miniFoto(p)}
        <span style="flex:1;min-width:0"><span class="nm">${esc(p.nombre)}${p.unidad==='kg'?' · x kg':''}</span><br><span class="mt">${esc(p.ean||'sin código')} · stock ${fmtCant(p,p.stock)}</span></span>
        <span class="num" style="font-weight:600">${$m(p.precio)}${p.unidad==='kg'?'/kg':''}</span></li>`).join('');
    $$('#res li').forEach(li=>li.onclick=()=>{ elegirResultado(li.dataset.tipo,li.dataset.id); inp.value=''; cerrarRes(); inp.focus(); });
  });
  inp.addEventListener('keydown',e=>{
    const items=$$('#res li');
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();sel=Math.min(sel+1,items.length-1);items.forEach((l,i)=>l.classList.toggle('sel',i===sel));}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();sel=Math.max(sel-1,0);items.forEach((l,i)=>l.classList.toggle('sel',i===sel));}
    else if(e.key==='Enter'){
      e.preventDefault();
      const v=inp.value.trim(); if(!v) return;
      if(sel>=0&&items[sel]){ elegirResultado(items[sel].dataset.tipo,items[sel].dataset.id); inp.value=''; cerrarRes(); return; }
      // el lector de códigos escribe y manda Enter: buscamos EAN exacto
      const p=db.productos.find(x=>(x.ean||'')===v);
      if(p){ seleccionarProducto(p); inp.value=''; cerrarRes(); return; }
      const r=buscarProductos(v,2), rc=buscarCombos(v,2);
      if(r.length+rc.length===1){ rc.length? agregarComboAlTicket(rc[0]) : seleccionarProducto(r[0]); inp.value=''; cerrarRes(); return; }
      if(!r.length&&!rc.length) codigoDesconocido(v);
    }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.results')&&!e.target.closest('.scan')) cerrarRes(); });
}
function elegirResultado(tipo,id){
  if(tipo==='combo'){ const c=(db.combos||[]).find(x=>x.id===id); if(c) agregarComboAlTicket(c); }
  else seleccionarProducto(prod(id));
}

function codigoDesconocido(cod){
  modal({titulo:'Ese código no está cargado',
    cuerpo:`<p style="margin:0 0 14px;line-height:1.6">No hay ningún producto con el código <b class="num">${esc(cod)}</b>. Podés darlo de alta ahora y seguir vendiendo.</p>`,
    pie:`<button class="btn ghost" data-cerrar>Seguir sin cargarlo</button><button class="btn" id="altaYa">Dar de alta</button>`,
    alAbrir:ov=>$('#altaYa',ov).onclick=()=>{ cerrarModal(); formProducto(null,{ean:cod},p=>{ seleccionarProducto(p); }); }});
}

function pintarPOS(){
  if(vista!=='vender') return;
  const t=totalTicket();

  /* tabla de ítems */
  $('#posTabla').innerHTML = !ticket.length
    ? `<div class="empty"><b>Todavía no cargaste nada</b>Pasá el lector por el código de barras o escribí el nombre del producto arriba.</div>`
    : `<table class="mtable"><thead><tr><th>Producto</th><th style="width:130px">Cantidad</th><th class="r">Precio</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>
      ${ticket.map(i=>{
        if(i.tipo==='combo'){
          const disp=Math.min(...i.componentes.map(c=>{const p=prod(c.prodId);return p?Math.floor(Number(p.stock)/c.cant):0;}));
          return `<tr>
            <td data-label="Producto"><b>${esc(i.nombre)}</b> <span class="pill info">Combo</span>${i.cant>disp?`<br><span class="pill bad">alcanza para ${disp}</span>`:''}<br><span style="font-size:12px;color:var(--muted)">${esc(i.componentes.map(c=>c.cant+'× '+c.nombre).join(' + '))}</span></td>
            <td data-label="Cantidad"><div class="qty"><button data-menos="${i.id}" aria-label="Restar">–</button><input class="num" data-cant="${i.id}" value="${i.cant}"><button data-mas="${i.id}" aria-label="Sumar">+</button></div></td>
            <td data-label="Precio" class="r num">${$m(i.precio)}</td>
            <td data-label="Subtotal" class="r num" style="font-weight:600">${$m(i.precio*i.cant)}</td>
            <td class="r"><button class="x" data-quita="${i.id}" title="Sacar del ticket" aria-label="Sacar del ticket">${ic('cerrar')}</button></td></tr>`;
        }
        const p=prod(i.prodId);
        const pct=promoParaProducto(p);
        const precioProm=pct>0?Math.round(i.precio*(1-pct/100)*10000)/10000:i.precio;
        return `<tr>
        <td data-label="Producto"><b>${esc(i.nombre)}</b>${pct>0?` <span class="pill ok">Promo −${pct}%</span>`:''}${p&&i.cant>p.stock?`<br><span class="pill bad">stock ${fmtCant(p,p?p.stock:0)}</span>`:''}</td>
        <td data-label="Cantidad"><div class="qty"><button data-menos="${i.id}" aria-label="Restar">–</button><input class="num" data-cant="${i.id}" value="${i.cant}"><button data-mas="${i.id}" aria-label="Sumar">+</button></div>${p&&p.unidad==='kg'?'<div style="font-size:11px;color:var(--muted);margin-top:3px">kg</div>':''}</td>
        <td data-label="Precio" class="r num">${pct>0?`<span style="text-decoration:line-through;color:var(--muted);font-size:12px;display:block">${$m(i.precio)}</span>${$m(precioProm)}`:$m(i.precio)}${p&&p.unidad==='kg'?'/kg':''}</td>
        <td data-label="Subtotal" class="r num" style="font-weight:600">${$m(precioProm*i.cant)}</td>
        <td class="r"><button class="x" data-quita="${i.id}" title="Sacar del ticket" aria-label="Sacar del ticket">${ic('cerrar')}</button></td></tr>`;}).join('')}
      </tbody></table>`;

  const redondear=n=>Math.round(n*1000)/1000;
  $$('[data-mas]').forEach(b=>b.onclick=()=>{const l=ticket.find(i=>i.id===b.dataset.mas);const p=l.tipo==='combo'?null:prod(l.prodId);l.cant=redondear(l.cant+(p&&p.unidad==='kg'?0.1:1));pintarPOS();});
  $$('[data-menos]').forEach(b=>b.onclick=()=>{const l=ticket.find(i=>i.id===b.dataset.menos);const p=l.tipo==='combo'?null:prod(l.prodId);const paso=p&&p.unidad==='kg'?0.1:1;l.cant=redondear(l.cant-paso);if(l.cant<=0.0009)ticket=ticket.filter(i=>i!==l);pintarPOS();});
  $$('[data-quita]').forEach(b=>b.onclick=()=>{ticket=ticket.filter(i=>i.id!==b.dataset.quita);pintarPOS();aviso('Ítem sacado del ticket');});
  $$('[data-cant]').forEach(inp=>inp.onchange=()=>{
    const l=ticket.find(i=>i.id===inp.dataset.cant), p=l.tipo==='combo'?null:prod(l.prodId);
    const n = p&&p.unidad==='kg' ? Math.max(0,redondear(num(inp.value))) : Math.max(0,Math.floor(num(inp.value)));
    if(!n){ticket=ticket.filter(i=>i!==l);} else l.cant=n; pintarPOS();
  });

  /* ticket */
  const pAuto=descuentoPromoAuto(), pPago=descuentoPromoPago();
  $('#tik').innerHTML=`
    <div class="tik-top"><b>${esc(db.config.nombre)}</b>Ticket Nº ${String(db.config.nroVenta).padStart(5,'0')} · ${fFH(Date.now())}</div>
    ${ticket.length?`<ul class="tik-items">${ticket.map(i=>{
        const p=i.tipo==='combo'?null:prod(i.prodId);
        const pct=i.tipo==='combo'?0:promoParaProducto(p);
        const pu=pct>0?Math.round(i.precio*(1-pct/100)*10000)/10000:i.precio;
        return `<li>
        <div class="tik-l1"><span>${esc(i.nombre)}${i.tipo==='combo'?' <span style="font-size:11px;color:var(--muted)">(combo)</span>':''}${pct>0?` <span style="font-size:11px;color:var(--verde)">promo −${pct}%</span>`:''}</span><span class="dots"></span></div>
        <div class="tik-l2"><span class="um">${fmtCant(p,i.cant)} × ${$m(pu)}</span><span class="num" style="font-weight:600">${$m(i.cant*pu)}</span></div>
      </li>`;}).join('')}</ul>`
      :`<div class="tik-empty">— ticket en blanco —<br>esperando el primer producto</div>`}
    ${(pAuto>0||montoDescuento()>0||pPago>0)?`<div class="tik-dto">
      <div class="tik-fila-dto"><span>Subtotal</span><b class="num">${$m(subtotalTicket())}</b></div>
      ${pAuto>0?`<div class="tik-fila-dto dto"><span>Promociones</span><b class="num">− ${$m(pAuto)}</b></div>`:''}
      ${montoDescuento()>0?`<div class="tik-fila-dto dto"><span>Descuento${dto.tipo==='porcentaje'?` ${num(dto.valor)}%`:''}${dto.motivo?` · ${esc(dto.motivo)}`:''}</span><b class="num">− ${$m(montoDescuento())}</b></div>`:''}
      ${pPago>0?`<div class="tik-fila-dto dto"><span>Promo por pagar con ${FORMAS[pago]}</span><b class="num">− ${$m(pPago)}</b></div>`:''}
    </div>`:''}
    <div class="tik-tot"><span>Total</span><b>${$m(t)}</b></div>`;

  /* cobro — resumen compacto; el medio de pago se elige en un modal aparte */
  const hayDto=montoDescuento()>0;
  $('#cobro').innerHTML=`
    ${ticket.length?`<div class="dto-box ${hayDto?'activo':''}">
      ${hayDto?`
        <div class="dto-resumen">
          <div><span class="dto-tit">Descuento aplicado</span>
            <b class="num">− ${$m(montoDescuento())}</b>
            <span class="dto-det">${dto.tipo==='porcentaje'?num(dto.valor)+'% sobre '+$m(subtotalTicket()):'monto fijo'}${dto.motivo?` · ${esc(dto.motivo)}`:''}</span></div>
          <div class="row" style="gap:6px">
            <button type="button" class="btn text sm" id="dtoEditar">Cambiar</button>
            <button type="button" class="btn text sm" id="dtoQuitar" style="color:var(--rojo)">Quitar</button>
          </div>
        </div>`
      :`<button type="button" class="btn ghost sm" id="dtoAbrir" style="width:100%">${ic('mas')} Aplicar descuento</button>`}
    </div>`:''}
    ${ticket.length?`<button class="btn verde big" id="abrirPago">Elegir medio de pago</button>
      <button class="btn ghost sm" id="limpiar" style="width:100%;margin-top:9px">Cancelar la venta</button>`
    :`<div class="hint" style="text-align:center;padding:18px 4px">Cargá al menos un producto para poder cobrar.</div>`}`;

  const bda=$('#dtoAbrir'); if(bda) bda.onclick=()=>formDescuento();
  const bde=$('#dtoEditar'); if(bde) bde.onclick=()=>formDescuento();
  const bdq=$('#dtoQuitar'); if(bdq) bdq.onclick=()=>{limpiarDescuento();pintarPOS();aviso('Descuento quitado');};
  const bl=$('#limpiar'); if(bl) bl.onclick=()=>{ticket=[];recibido='';pagoMixto=[];pago='';limpiarDescuento();pintarPOS();aviso('Venta cancelada');};
  const bap=$('#abrirPago'); if(bap) bap.onclick=()=>abrirModalPago();

  const hoyV=db.ventas.filter(v=>v.fecha.slice(0,10)===hoy()&&!v.anulada);
  const el=$('#posVentasHoy');
  if(el) el.textContent=`Hoy: ${hoyV.length} ventas · ${$m(hoyV.reduce((a,v)=>a+v.total,0))}`;
}

/* ── modal de medio de pago: todo el flujo de cobro vive acá ── */
function abrirModalPago(){
  if(!ticket.length) return;
  if(!pago) pago='efectivo';
  modal({titulo:'¿Cómo te pagan?',
    cuerpo:`<div id="pagoBody"></div>`,
    pie:`<button class="btn ghost" data-cerrar>Volver al ticket</button>`,
    alAbrir:ov=>pintarPagoModal(ov)});
}
function pintarPagoModal(ov){
  const t=totalTicket();
  const vuelto=num(recibido)-t;
  const pctPago=promoPagoPct(pago);
  $('#pagoBody',ov).innerHTML=`
    <div class="kpi" style="margin-bottom:18px"><span>Total a cobrar</span><b style="font-size:24px">${$m(t)}</b>${pctPago>0?`<small style="display:block;color:var(--verde);font-weight:600;margin-top:3px">Incluye −${pctPago}% por pagar con ${FORMAS[pago]}</small>`:''}</div>
    <div class="seg">
      ${FORMAS_BOTONES.map(f=>{const pf=promoPagoPct(f);return `<button data-p="${f}" class="${pago===f?'on':''}">${FORMAS[f]}${pf>0?` −${pf}%`:''}</button>`;}).join('')}
      <button data-p="mixto" class="${pago==='mixto'?'on':''}">Dividir pago</button>
    </div>
    ${pago==='efectivo'?`
      <label class="f" for="rec">Con cuánto paga</label>
      <input id="rec" class="inp num" inputmode="decimal" placeholder="0,00" value="${esc(recibido)}">
      <div class="vuelto ${recibido&&vuelto<0?'falta':''}">
        <span>${recibido&&vuelto<0?'Falta':'Vuelto'}</span><b>${recibido?$m(Math.abs(vuelto)):'—'}</b>
      </div>
      <button class="btn verde big" id="cobrar" style="margin-top:8px">Cobrar ${$m(t)}</button>`
    : pago==='fiado'?`
      <label class="f" for="cliF">¿A quién se lo anotamos?</label>
      <select id="cliF" class="inp">
        <option value="">Elegí un cliente…</option>
        ${db.clientes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${clienteFiado===c.id?'selected':''}>${esc(c.nombre)}${Number(c.saldo)>0?` — debe ${$m(c.saldo)}`:''}</option>`).join('')}
      </select>
      <button class="btn ghost sm" id="nuevoCliRapido" style="margin:8px 0 14px">+ Cliente nuevo</button>
      <button class="btn big" id="anotar">Anotar ${$m(t)} en la cuenta</button>`
    : pago==='mixto'?`
      <div class="hint" style="margin:14px 0 12px">Repartí el total entre dos o más métodos — tienen que sumar exacto.</div>
      <div id="mixtoFilas"></div>
      <button type="button" class="btn ghost sm" id="mixtoAgregar" style="width:100%;margin:4px 0 14px">+ Agregar otro método</button>
      <div id="mixtoCliWrap"></div>
      <div id="mixtoResumen" style="margin-bottom:14px"></div>
      <button class="btn verde big" id="cobrarMixto">Confirmar cobro</button>`
    :`
      <div class="hint" style="margin:16px 0">Se va a registrar como cobro por <b>${FORMAS[pago]}</b>, por el total exacto — no maneja vuelto.</div>
      <button class="btn verde big" id="cobrarElec">Cobrar ${$m(t)} por ${FORMAS[pago]}</button>`}`;

  $$('.seg button',ov).forEach(b=>b.onclick=()=>{
    pago=b.dataset.p;
    if(pago==='mixto'&&!pagoMixto.length) pagoMixto=[{forma:'efectivo',monto:''},{forma:'tarjeta',monto:''}];
    pintarPagoModal(ov);
  });
  const rec=$('#rec',ov);
  if(rec){
    rec.focus();
    rec.oninput=()=>{ recibido=rec.value; const v=num(recibido)-t;
      const box=$('.vuelto',ov); box.className='vuelto '+(recibido&&v<0?'falta':'');
      box.innerHTML=`<span>${recibido&&v<0?'Falta':'Vuelto'}</span><b>${recibido?$m(Math.abs(v)):'—'}</b>`; };
  }
  const cf=$('#cliF',ov); if(cf) cf.onchange=()=>clienteFiado=cf.value;
  const nc=$('#nuevoCliRapido',ov); if(nc) nc.onclick=()=>formCliente(null,c=>{clienteFiado=c.id;pintarPagoModal(ov);});
  const bc=$('#cobrar',ov); if(bc) bc.onclick=()=>{ if(cerrarVenta('efectivo')) cerrarModal(); };
  const ba=$('#anotar',ov); if(ba) ba.onclick=()=>{ if(cerrarVenta('fiado')) cerrarModal(); };
  const be=$('#cobrarElec',ov); if(be) be.onclick=()=>{ if(cerrarVenta(pago)) cerrarModal(); };
  if(pago==='mixto') pintarMixtoFilas(t,ov);
  const bm=$('#cobrarMixto',ov); if(bm) bm.onclick=()=>{ if(cerrarVenta('mixto')) cerrarModal(); };
  const ma=$('#mixtoAgregar',ov); if(ma) ma.onclick=()=>{ pagoMixto.push({forma:'transferencia',monto:''}); pintarPagoModal(ov); };
}

function pintarMixtoFilas(t,root=document){
  const cont=$('#mixtoFilas',root); if(!cont) return;
  cont.innerHTML=pagoMixto.map((f,ix)=>`
    <div class="row" style="margin-bottom:8px;flex-wrap:nowrap">
      <select class="inp" data-mx-forma="${ix}" style="flex:1.3">
        ${['efectivo','transferencia','tarjeta','fiado'].map(k=>`<option value="${k}" ${f.forma===k?'selected':''}>${FORMAS[k]}</option>`).join('')}
      </select>
      <input class="inp num" data-mx-monto="${ix}" inputmode="decimal" placeholder="0,00" value="${esc(f.monto)}" style="flex:1">
      ${pagoMixto.length>2?`<button type="button" class="x" data-mx-del="${ix}" aria-label="Quitar método">${ic('cerrar')}</button>`:''}
    </div>`).join('');
  $$('[data-mx-forma]',cont).forEach(s=>s.onchange=()=>{pagoMixto[s.dataset.mxForma].forma=s.value;pintarPagoModal(root===document?document.querySelector('#ov'):root);});
  $$('[data-mx-monto]',cont).forEach(i=>i.oninput=()=>{pagoMixto[i.dataset.mxMonto].monto=i.value;actualizarResumenMixto(t,root);});
  $$('[data-mx-del]',cont).forEach(b=>b.onclick=()=>{pagoMixto.splice(b.dataset.mxDel,1);pintarPagoModal(root===document?document.querySelector('#ov'):root);});
  const wrap=$('#mixtoCliWrap',root);
  if(wrap){
    wrap.innerHTML = pagoMixto.some(f=>f.forma==='fiado') ? `
      <label class="f" for="cliFMix">¿A quién le anotamos la parte fiada?</label>
      <select id="cliFMix" class="inp" style="margin-bottom:14px">
        <option value="">Elegí un cliente…</option>
        ${db.clientes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${clienteFiado===c.id?'selected':''}>${esc(c.nombre)}${Number(c.saldo)>0?` — debe ${$m(c.saldo)}`:''}</option>`).join('')}
      </select>` : '';
    const cf2=$('#cliFMix',root); if(cf2) cf2.onchange=()=>clienteFiado=cf2.value;
  }
  actualizarResumenMixto(t,root);
}
function actualizarResumenMixto(t,root=document){
  t = t!==undefined ? t : totalTicket();
  const suma=pagoMixto.reduce((a,f)=>a+num(f.monto),0);
  const resto=t-suma;
  const el=$('#mixtoResumen',root);
  if(el) el.innerHTML = Math.abs(resto)<0.005
    ? `<div class="vuelto"><span>Cubierto</span><b>${$m(t)}</b></div>`
    : `<div class="vuelto falta"><span>${resto>0?'Falta cubrir':'Te pasaste por'}</span><b>${$m(Math.abs(resto))}</b></div>`;
  const btn=$('#cobrarMixto',root);
  if(btn) btn.disabled = !ticket.length || Math.abs(resto)>=0.005 || pagoMixto.some(f=>!f.forma||num(f.monto)<=0);
}

function buildVentaItem(i){
  if(i.tipo==='combo'){
    return {tipo:'combo', comboId:i.comboId, nombre:i.nombre, cant:i.cant, precio:i.precio,
      costo:(i.componentes||[]).reduce((a,c)=>a+(c.costo||0)*c.cant,0), componentes:i.componentes};
  }
  const p=prod(i.prodId);
  return {tipo:'producto', prodId:i.prodId, nombre:i.nombre, cant:i.cant, precio:i.precio,
    costo:Number((p||{}).costo)||0, rubro:(p||{}).rubro||''};
}

const MOTIVOS_DTO=['Pago en efectivo','Cliente habitual','Producto próximo a vencer','Producto con golpe','Promoción','Redondeo'];
function formDescuento(){
  const sub=subtotalTicket();
  let tipo=dto.tipo, valor=dto.valor, motivo=dto.motivo||MOTIVOS_DTO[0];
  modal({titulo:'Descuento en esta venta',
    cuerpo:`
      <div class="kpi" style="margin-bottom:16px"><span>Subtotal del ticket</span><b>${$m(sub)}</b></div>
      <label class="f">¿Cómo lo calculamos?</label>
      <div class="seg" style="margin-bottom:14px">
        <button type="button" data-dt="porcentaje" class="${tipo==='porcentaje'?'on':''}">Por porcentaje</button>
        <button type="button" data-dt="monto" class="${tipo==='monto'?'on':''}">Por monto fijo</button>
      </div>
      <label class="f" for="dt_valor" id="dt_lbl">${tipo==='porcentaje'?'Porcentaje de descuento':'Monto a descontar'}</label>
      <input id="dt_valor" class="inp num" inputmode="decimal" value="${esc(valor)}" placeholder="${tipo==='porcentaje'?'Ej: 10':'Ej: 500'}">
      <div class="row" style="margin-top:9px" id="dt_rapidos"></div>
      <label class="f" for="dt_mot" style="margin-top:16px">Motivo</label>
      <select id="dt_mot" class="inp">
        ${MOTIVOS_DTO.map(m=>`<option ${motivo===m?'selected':''}>${m}</option>`).join('')}
        <option value="__otro__">+ Escribir otro motivo…</option>
      </select>
      <input id="dt_otro" class="inp" placeholder="Escribí el motivo" hidden style="margin-top:9px">
      <div id="dt_prev" style="margin-top:16px"></div>`,
    pie:`<button class="btn ghost" data-cerrar>Cancelar</button><button class="btn verde" id="okDto">Aplicar descuento</button>`,
    alAbrir:ov=>{
      const inp=$('#dt_valor',ov), sel=$('#dt_mot',ov), otro=$('#dt_otro',ov);
      const rapidos=()=>{
        const op = tipo==='porcentaje' ? [5,10,15,20] : [100,200,500,1000];
        $('#dt_rapidos',ov).innerHTML=op.map(v=>`<button type="button" class="btn ghost sm" data-dr="${v}">${tipo==='porcentaje'?v+'%':$m(v)}</button>`).join('');
        $$('[data-dr]',ov).forEach(b=>b.onclick=()=>{inp.value=b.dataset.dr;upd();inp.focus();});
      };
      const upd=()=>{
        const v=num(inp.value);
        const m = !v||sub<=0 ? 0 : (tipo==='porcentaje'? sub*Math.min(100,v)/100 : Math.min(sub,v));
        const fin=Math.max(0,sub-m);
        $('#dt_prev',ov).innerHTML = m>0
          ? `<div class="nota-dash">Se descuentan <b class="num">${$m(m)}</b> · el cliente paga <b class="num">${$m(fin)}</b>${tipo==='monto'&&sub>0?` (${(m/sub*100).toFixed(1)}%)`:''}</div>`
          : '';
        $('#okDto',ov).disabled = !(m>0);
      };
      $$('[data-dt]',ov).forEach(b=>b.onclick=()=>{
        tipo=b.dataset.dt; $$('[data-dt]',ov).forEach(x=>x.classList.toggle('on',x===b));
        $('#dt_lbl',ov).textContent = tipo==='porcentaje'?'Porcentaje de descuento':'Monto a descontar';
        inp.placeholder = tipo==='porcentaje'?'Ej: 10':'Ej: 500';
        rapidos(); upd();
      });
      sel.onchange=()=>{ otro.hidden = sel.value!=='__otro__'; if(!otro.hidden) otro.focus(); };
      inp.oninput=upd;
      inp.onkeydown=e=>{ if(e.key==='Enter'&&!$('#okDto',ov).disabled){e.preventDefault();$('#okDto',ov).click();} };
      rapidos(); upd(); inp.focus(); inp.select();
      $('#okDto',ov).onclick=()=>{
        const v=num(inp.value);
        if(v<=0){aviso('Poné un valor mayor a cero','bad');return;}
        let mot = sel.value==='__otro__' ? otro.value.trim() : sel.value;
        if(sel.value==='__otro__'&&!mot){aviso('Escribí el motivo del descuento','bad');otro.focus();return;}
        dto={tipo,valor:String(v),motivo:mot};
        cerrarModal(); pintarPOS();
        aviso(`Descuento de ${$m(montoDescuento())} aplicado`,'ok');
      };
    }});
}

function cerrarVenta(forma){
  if(!ticket.length) return;
  const total=totalTicket();
  let pagosFinal=null, clienteId='';

  if(forma==='mixto'){
    const suma=pagoMixto.reduce((a,f)=>a+num(f.monto),0);
    if(pagoMixto.some(f=>!f.forma||num(f.monto)<=0)){ aviso('Completá todos los métodos con un monto mayor a cero','bad'); return; }
    if(Math.abs(suma-total)>=0.01){ aviso('Los montos combinados no suman el total','bad'); return; }
    const fiadoParte=pagoMixto.find(f=>f.forma==='fiado');
    if(fiadoParte){
      const cf=$('#cliFMix');
      if(!cf||!cf.value){ aviso('Elegí a qué cliente le anotás la parte fiada','bad'); return; }
      clienteId=cf.value;
    }
    pagosFinal=pagoMixto.map(f=>({forma:f.forma,monto:num(f.monto)}));
  } else {
    if(forma==='fiado'&&!clienteFiado){ aviso('Elegí a qué cliente se lo anotás','bad'); return; }
    if(forma==='efectivo'&&recibido&&num(recibido)<total){ aviso('El monto recibido no alcanza','bad'); return; }
    clienteId = forma==='fiado'? clienteFiado : '';
  }

  const venta={
    id:uid(), nro:db.config.nroVenta, fecha:new Date().toISOString(),
    items: ticket.map(buildVentaItem),
    subtotal: subtotalTicket(),
    descuento: montoDescuento(),
    descuentoDetalle: montoDescuento()>0 ? {tipo:dto.tipo,valor:num(dto.valor),motivo:dto.motivo} : null,
    promoAuto: descuentoPromoAuto(),
    promoAutoDetalle: detallePromoAuto(),
    promoPago: forma!=='mixto' ? descuentoPromoPago() : 0,
    promoPagoDetalle: (forma!=='mixto'&&promoPagoPct(forma)>0) ? {forma,porcentaje:promoPagoPct(forma)} : null,
    total, forma,
    recibido: forma==='efectivo'? (num(recibido)||total) : total,
    vuelto: forma==='efectivo'? Math.max(0,(num(recibido)||total)-total) : 0,
    clienteId,
    pagos: pagosFinal
  };

  // descuento de stock + movimiento por cada ítem (expandiendo combos en sus componentes)
  const tocados=new Set();
  venta.items.forEach(item=>{
    if(item.tipo==='combo'){
      (item.componentes||[]).forEach(c=>{
        const p=prod(c.prodId);
        if(p){ const cant=c.cant*item.cant; p.stock=Number(p.stock)-cant; tocados.add(p.id);
               movimiento(p.id,'venta',-cant,'Venta Nº'+venta.nro+' (combo: '+item.nombre+')',venta.id); }
      });
    } else {
      const p=prod(item.prodId);
      if(p){ p.stock=Number(p.stock)-item.cant; tocados.add(p.id);
             movimiento(p.id,'venta',-item.cant,'Venta Nº'+venta.nro,venta.id); }
    }
  });

  if(forma==='fiado'){ const c=cli(clienteId); if(c) c.saldo=Number(c.saldo||0)+total; }
  else if(forma==='mixto'&&clienteId){ const parte=pagosFinal.find(f=>f.forma==='fiado'); const c=cli(clienteId); if(c&&parte) c.saldo=Number(c.saldo||0)+parte.monto; }

  db.ventas.push(venta);
  db.config.nroVenta++;
  guardar();

  const negativos=[...tocados].map(id=>prod(id)).filter(p=>p&&p.stock<0);
  const t=$('#tik'); if(t){ t.classList.add('tear'); }

  const nombreCli = clienteId ? ((cli(clienteId)||{}).nombre||'la cuenta') : '';

  setTimeout(()=>{
    ticket=[]; recibido=''; clienteFiado=''; pago='efectivo'; pagoMixto=[]; limpiarDescuento();
    pintarNav(); pintarPOS();
    const t2=$('#tik'); if(t2){ t2.classList.remove('tear'); t2.classList.add('roll'); setTimeout(()=>t2.classList.remove('roll'),400); }
    $('#scan')&&$('#scan').focus();
  },380);

  ticketImpreso(venta);
  aviso(
    forma==='fiado'?`Anotado en la cuenta de ${nombreCli}`
    :forma==='efectivo'?`Venta cerrada · vuelto ${$m(venta.vuelto)}`
    :forma==='mixto'?`Venta cerrada con pago combinado${nombreCli?' · parte anotada a '+nombreCli:''}`
    :`Venta cerrada por ${FORMAS[forma]}`,'ok');
  if(negativos.length) aviso('Quedó stock negativo: revisá '+negativos.map(p=>p.nombre).join(', '),'bad');
  return true;
}

function ticketImpreso(v){
  const esElectronico=FORMAS_ELECTRONICAS.includes(v.forma);
  const esMixto=v.forma==='mixto';
  modal({titulo:`Venta Nº ${v.nro} registrada`,
    cuerpo:`<div class="grid3">
        <div class="kpi"><span>Total</span><b>${$m(v.total)}</b></div>
        <div class="kpi"><span>${v.forma==='fiado'?'Fiado a':esMixto?'Pago':esElectronico?'Cobrado por':'Recibió'}</span><b style="font-size:${esMixto?'14px':'19px'}">${v.forma==='fiado'?esc(cli(v.clienteId)?cli(v.clienteId).nombre:'—'):esMixto?esc(detalleForma(v)):esElectronico?FORMAS[v.forma]:$m(v.recibido)}</b></div>
        <div class="kpi"><span>Vuelto</span><b>${$m(v.vuelto)}</b></div>
      </div>
      <p style="color:var(--muted);margin:16px 0 0;line-height:1.6">El comprobante sale en 58 mm, no fiscal. Sirve como control interno y para el cliente.</p>`,
    pie:`<button class="btn ghost" data-cerrar>Listo</button><button class="btn" id="impr">Imprimir ticket</button>`,
    alAbrir:ov=>$('#impr',ov).onclick=()=>imprimirTicket(v)});
}

function imprimirTicket(v){
  const esElectronico=FORMAS_ELECTRONICAS.includes(v.forma);
  $('#print').innerHTML=`
    <div class="c b">${esc(db.config.nombre).toUpperCase()}</div>
    <div class="c">COMPROBANTE NO FISCAL</div>
    <div class="c">Ticket N° ${String(v.nro).padStart(5,'0')}</div>
    <div class="c">${fFH(v.fecha)}</div>
    <hr>
    <table>${v.items.map(i=>{
      if(i.tipo==='combo'){
        return `<tr><td colspan="2">${esc(i.nombre)} (combo)</td></tr>
          ${i.componentes.map(c=>`<tr><td colspan="2">&nbsp;&nbsp;· ${c.cant}x ${esc(c.nombre)}</td></tr>`).join('')}
          <tr><td>${i.cant} x ${nfM.format(i.precio)}</td><td class="r">${nfM.format(i.cant*i.precio)}</td></tr>`;
      }
      const p=prod(i.prodId);const kg=p&&p.unidad==='kg';
      const dp=(v.promoAutoDetalle||[]).find(d=>d.itemId===i.prodId);
      const pct=dp?dp.pct:0;
      const pu=pct>0?Math.round(i.precio*(1-pct/100)*10000)/10000:i.precio;
      return `<tr><td colspan="2">${esc(i.nombre)}${pct>0?' (promo -'+pct+'%)':''}</td></tr>
      <tr><td>${kg?nfKg.format(i.cant)+' kg x '+nfM.format(pu)+'/kg':i.cant+' x '+nfM.format(pu)}</td><td class="r">${nfM.format(i.cant*pu)}</td></tr>`;}).join('')}</table>
    <hr>
    <table>${(v.descuento>0||v.promoAuto>0||v.promoPago>0)?`<tr><td>Subtotal</td><td class="r">$${nfM.format(v.subtotal||0)}</td></tr>
      ${v.promoAuto>0?`<tr><td>Promociones</td><td class="r">-$${nfM.format(v.promoAuto)}</td></tr>`:''}
      ${v.descuento>0?`<tr><td>Descuento${v.descuentoDetalle&&v.descuentoDetalle.tipo==='porcentaje'?' '+v.descuentoDetalle.valor+'%':''}</td><td class="r">-$${nfM.format(v.descuento)}</td></tr>`:''}
      ${v.promoPago>0?`<tr><td>Promo ${esc(FORMAS[v.promoPagoDetalle&&v.promoPagoDetalle.forma]||'')}</td><td class="r">-$${nfM.format(v.promoPago)}</td></tr>`:''}`:''}
    <tr><td class="b">TOTAL</td><td class="r b" style="font-size:14px">$${nfM.format(v.total)}</td></tr>
    ${v.forma==='efectivo'?`<tr><td>Efectivo</td><td class="r">$${nfM.format(v.recibido)}</td></tr>
      <tr><td>Vuelto</td><td class="r">$${nfM.format(v.vuelto)}</td></tr>`
      :v.forma==='fiado'?`<tr><td colspan="2">FIADO — ${esc(cli(v.clienteId)?cli(v.clienteId).nombre:'')}</td></tr>
        <tr><td>Saldo actual</td><td class="r">$${nfM.format(cli(v.clienteId)?cli(v.clienteId).saldo:0)}</td></tr>`
      :v.forma==='mixto'?`<tr><td colspan="2">PAGO COMBINADO</td></tr>
        ${v.pagos.map(pg=>`<tr><td>${esc(FORMAS[pg.forma]||pg.forma)}</td><td class="r">$${nfM.format(pg.monto)}</td></tr>`).join('')}

    </table>

    <div class="c">¡Gracias por la compra!</div>`;
  window.print();
}

function listaFiltrada(){
  const q=fProd.q.trim().toLowerCase();
  let l=db.productos.filter(p=>
    (!fProd.rubro||p.rubro===fProd.rubro) &&
    (!q||(p.nombre||'').toLowerCase().includes(q)||(p.ean||'').toLowerCase().includes(q)||(p.rubro||'').toLowerCase().includes(q))
  );
  const marg=p=>Number(p.costo)>0?(p.precio-p.costo)/p.costo:0;
  l.sort((a,b)=> fProd.orden==='stock'? a.stock-b.stock
    : fProd.orden==='rubro'? (a.rubro||'').localeCompare(b.rubro||'')||a.nombre.localeCompare(b.nombre)
    : fProd.orden==='margen'? marg(b)-marg(a)
    : a.nombre.localeCompare(b.nombre));
  return l;
}

function tablaProductos(){
  const l=listaFiltrada();
  const c=$('#tabProd');
  if(!db.productos.length){
    c.innerHTML=`<div class="empty"><b>El depósito está vacío</b>Cargá el primer producto con nombre, precio y stock. Después el lector hace el resto.</div>`;return;
  }
  if(!l.length){ c.innerHTML=`<div class="empty"><b>Sin resultados</b>Probá con otra palabra o quitá el filtro de rubro.</div>`; return; }
  c.innerHTML=`<table class="mtable"><thead><tr>
    <th>Producto</th><th>Código</th><th>Rubro</th><th class="r">Costo</th><th class="r">Venta</th><th class="r">Margen</th><th class="r">Stock</th><th></th>
  </tr></thead><tbody>${l.map(p=>{
    const mg=Number(p.costo)>0?((p.precio-p.costo)/p.costo*100):null;
    return `<tr>
      <td data-label="Producto"><b>${esc(p.nombre)}</b>${p.unidad==='kg'?' <span class="pill info">kg</span>':''}${esSuelto(p)?` <span class="pill warn">suelto</span>`:''}${alertaVence(p)?` <span class="pill ${estaVencido(p)?'bad':'warn'}">${esc(textoVence(p))}</span>`:(p.vence?` <span class="pill mute">vence ${fFecha(p.vence+'T12:00:00')}</span>`:'')}${esSuelto(p)?`<br><span style="font-size:12px;color:var(--muted)">sale de ${esc((atadoDe(p)||{}).nombre||'(atado eliminado)')} · ${porAtado(p)} por atado</span>`:(p.proveedor?`<br><span class="mt" style="font-size:12px;color:var(--muted)">${esc(p.proveedor)}</span>`:'')}</td>

      <td data-label="Rubro">${p.rubro?`<span class="pill mute">${esc(p.rubro)}</span>`:'—'}</td>

      <td data-label="Stock" class="r"><span class="pill ${p.stock<=0?'bad':bajo(p)?'warn':'ok'} num">${fmtCant(p,p.stock)}</span><br><span style="font-size:11px;color:var(--muted)">${esSuelto(p)?`quedan ${fmtCant(atadoDe(p)||p,(atadoDe(p)||{}).stock||0)} atados`:`mín ${fmtCant(p,p.stockMin)} · ideal ${fmtCant(p,deseado(p))}`}</span></td>
      <td class="r" style="white-space:nowrap">
        ${esSuelto(p)?`<button class="btn ghost sm" data-abrir="${p.id}">${ic('combo')} Abrir atado</button>`:''}

        <button class="btn text sm" data-hi="${p.id}">${ic('historial')} Historial</button>
      </td></tr>`;}).join('')}</tbody></table>`;
  $$('[data-abrir]').forEach(b=>b.onclick=()=>formAbrirAtado(b.dataset.abrir));

    alAbrir:ov=>{

        if(tipo==='suelto'){
          const or=prod($('#f_origen',ov).value);

          if(or){
            const cu=(Number(or.costo)||0)/upa;
            const cerrado=Number(or.precio)||0;
            el.innerHTML=`Cada unidad te va a costar <b class="num">${$m(cu)}</b> (atado de ${$m(or.costo)} ÷ ${upa}).`
              + (pr>0?` Vendiendo a <b class="num">${$m(pr)}</b> ganás <b class="num">${$m(pr-cu)}</b> por unidad — el atado entero suelto te deja <b class="num">${$m(pr*upa-Number(or.costo))}</b>${cerrado>0?` contra ${$m(cerrado-Number(or.costo))} vendiéndolo cerrado`:''}.`:'');
          } else el.innerHTML='Elegí el atado de origen para ver el costo por unidad.';
          return;
        }
        el.innerHTML = c>0&&pr>0 ? `Margen: <b class="num">${((pr-c)/c*100).toFixed(1)}%</b> · ganás <b class="num">${$m(pr-c)}</b> por ${tipo==='kg'?'kilo':'unidad'}` : '';
      };
      $$('[data-un]',ov).forEach(b=>b.onclick=()=>{tipo=b.dataset.un;$$('[data-un]',ov).forEach(x=>x.classList.toggle('on',x===b));etiquetas();});
      const vx=$('#f_venceX',ov); if(vx) vx.onclick=()=>{$('#f_vence',ov).value='';avisoVence();};
      const avisoVence=()=>{
        const f=$('#f_vence',ov).value;
        const h=$('#hint_vence',ov);
        if(!f){ h.textContent=`Si lo cargás, te avisamos ${db.config.diasAvisoVence||7} días antes. Poné la fecha del lote que vence primero.`; h.style.color=''; return; }
        const d=diasParaVencer({vence:f});
        h.textContent = d<0?`Ojo: esa fecha ya pasó hace ${Math.abs(d)} días.`
          : d===0?'Vence hoy.' : d===1?'Vence mañana.' : `Faltan ${d} días. Te avisamos cuando queden ${db.config.diasAvisoVence||7}.`;
        h.style.color = d<=DIAS_AVISO()?'var(--ambar)':'';
      };
      $('#f_vence',ov).onchange=avisoVence; avisoVence();
      $('#f_origen',ov).onchange=mg;
      $('#f_porAtado',ov).oninput=mg;
      etiquetas();
      $('#f_cos',ov).oninput=mg; $('#f_pre',ov).oninput=mg;
      $('#f_' + (v.ean?'nom':'ean'),ov).focus();
      const bb=$('#borrar',ov);
      if(bb) bb.onclick=()=>{
        const hijos=sueltosDe(p.id);
        cerrarModal();confirmar('Eliminar producto',
        `Vas a borrar <b>${esc(p.nombre)}</b>. El historial de movimientos queda, pero el producto sale del listado y del buscador.`
        +(hijos.length?`<br><br><b style="color:var(--ambar)">Ojo:</b> ${hijos.map(h=>esc(h.nombre)).join(', ')} ${hijos.length===1?'sale':'salen'} de este atado y ${hijos.length===1?'va a quedar':'van a quedar'} sin origen.`:''),
        ()=>{db.productos=db.productos.filter(x=>x.id!==p.id);guardar();render();aviso('Producto eliminado');},'Eliminar');};
      $('#guardarP',ov).onclick=()=>{
        const nom=$('#f_nom',ov).value.trim();
        if(!nom){aviso('Falta el nombre del producto','bad');$('#f_nom',ov).focus();return;}
        const ean=$('#f_ean',ov).value.trim();
        const dup=db.productos.find(x=>ean&&x.ean===ean&&x.id!==(p?p.id:''));
        if(dup){aviso(`Ese código ya lo usa ${dup.nombre}`,'bad');return;}
        const su=tipo==='suelto';
        const origenId=su?$('#f_origen',ov).value:'';
        if(su&&!origenId){aviso('Elegí de qué atado sale este producto','bad');$('#f_origen',ov).focus();return;}
        const upa=su?Math.max(1,Math.floor(num($('#f_porAtado',ov).value))||20):0;
        const or=su?prod(origenId):null;
        const datos={ean,nombre:nom,rubro:$('#f_rub',ov).value.trim(),proveedor:$('#f_prov',ov).value.trim(),
          costo: su ? (or?Math.round((Number(or.costo)||0)/upa*10000)/10000 : 0) : num($('#f_cos',ov).value),
          precio:num($('#f_pre',ov).value),stockMin:num($('#f_min',ov).value),stockDeseado:num($('#f_des',ov).value),
          unidad: su?'unidad':tipo, origenId, porAtado:upa, vence:$('#f_vence',ov).value||''};
        let creado;
        if(p){ Object.assign(p,datos); creado=p; }
        else{ creado={id:uid(),stock:num($('#f_stk',ov).value),...datos};
              db.productos.push(creado);
              if(creado.stock) movimiento(creado.id,'ingreso',creado.stock,'Stock inicial'); }
        guardar(); cerrarModal();
        if(vista==='productos') tablaProductos(); else render();
        pintarNav();
        aviso(p?'Producto actualizado':'Producto cargado','ok');
        luego&&luego(creado);
      };
    }});
}
